[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "headless-re-mcp"
version = "0.2.1"
description = "Unified headless reverse-engineering MCP for IDA, x64dbg, and CLI backends"
readme = "README.md"
license = "GPL-3.0-only"
requires-python = ">=3.11"
authors = [{ name = "Headless RE-MCP contributors" }]
dependencies = [
  "mcp>=1.26.0,<2",
  "pydantic>=2.10",
  "platformdirs>=4.3",
]

[project.optional-dependencies]
ida = ["idapro>=0.0.10"]
pe = ["pefile>=2024.8.26"]
web = ["fastapi>=0.115", "uvicorn>=0.34", "httpx>=0.28"]
native = ["PySide6>=6.6"]
# Android reverse engineering: pure-Python ADB + APK static analysis + Frida.
android = ["adbutils>=2.12", "androguard>=4.1", "frida>=16.5"]
# Web reverse engineering: Chrome DevTools Protocol via Playwright.
browser = ["playwright>=1.40"]
# HTTP(S) interception shared by Web and Android workflows.
proxy = ["mitmproxy>=11"]
test = ["pytest>=8.3", "pytest-asyncio>=0.25", "pytest-cov>=6.0"]
dev = ["headless-re-mcp[test]", "ruff>=0.9", "mypy>=1.14"]

[project.scripts]
headless-re-mcp = "headless_re_mcp.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/headless_re_mcp"]

[tool.hatch.build.targets.sdist]
include = [
  "/src/headless_re_mcp",
  "/pyproject.toml",
  "/README.md",
  "/LICENSE",
  "/upstream.lock.json",
  "/start_web.py",
  "/setup.py",
]
exclude = [
  "**/__pycache__",
  "**/.pytest_cache",
  "**/.mypy_cache",
  "**/.ruff_cache",
  "**/node_modules",
  "**/*.pyc",
  "**/*.pyo",
  "**/*.dmp",
  "**/*.idb",
  "**/*.i64",
  "**/agent.db",
  "**/providers.json",
  "**/config.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "integration: requires a locally installed analysis backend",
  "headless: verifies no analyzer window is created",
  "visible_desktop: drives real windows, so it cannot run under HEADLESS_RE_HIDDEN_DESKTOP",
]

[tool.coverage.run]
source_pkgs = ["headless_re_mcp"]
branch = true
omit = [
  # Run inside a foreign interpreter -- IDA's Python and Ghidra's script host --
  # so pytest can never execute a line of them. Omitted to keep the number
  # meaningful, not because they are hard to test.
  "*/backends/ida/worker.py",
  "*/backends/ida/gate_worker.py",
  "*/backends/ghidra/scripts/*",
]

[tool.coverage.report]
# Set just below the measured value so it ratchets. Raise it when real coverage
# rises; never lower it to turn a red build green.
fail_under = 64
show_missing = false
skip_covered = true
exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "@(typing\\.)?overload",
  "if __name__ == .__main__.:",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "E303"]
# E303 only fires in preview. Padded blank lines once inflated a gate file to
# seven times its real length without tripping any check, so it is opted into
# by code while explicit-preview-rules keeps the rest of preview out of CI.
preview = true
explicit-preview-rules = true

[tool.ruff.lint.per-file-ignores]
# SQL / monkeypatch extension surfaces keep long literal lines by design.
"src/headless_re_mcp/core/store/*.py" = ["E501"]
"src/headless_re_mcp/core/service_ext.py" = ["E501"]
"src/headless_re_mcp/mcp/server.py" = ["E501"]
"src/headless_re_mcp/agent/*.py" = ["E501"]
"src/headless_re_mcp/agent/providers/*.py" = ["E501"]
"src/headless_re_mcp/tools/catalog.py" = ["E501"]
"src/headless_re_mcp/web/routes/*.py" = ["E501"]
"src/headless_re_mcp/backends/ghidra/scripts/ExportJson.py" = ["F821"]
"src/headless_re_mcp/core/capabilities_catalog.py" = ["E501"]
"src/headless_re_mcp/core/process_tree.py" = ["E501"]
"src/headless_re_mcp/core/ui_win32.py" = ["E501"]
"src/headless_re_mcp/native_app/bootstrap.py" = ["E501"]
"src/headless_re_mcp/native_app/gui.py" = ["E501"]
"src/headless_re_mcp/web/monitor.py" = ["E501"]
"tests/integration/test_agent_browser_smoke.py" = ["E501"]
"tests/unit/test_agent_*.py" = ["E501"]
"tests/unit/test_attach_ux.py" = ["E501"]
"tests/unit/test_m7_external_adapters.py" = ["E501"]
"tests/unit/test_m10_ui_backends_unit.py" = ["SIM117"]
"tests/unit/test_m11_external_timeouts.py" = ["SIM117"]
"tests/unit/test_stub_calls.py" = ["E501"]
"tests/unit/test_tool_catalog_agent.py" = ["E501"]
"tests/unit/test_web_launch.py" = ["E501"]
"src/headless_re_mcp/backends/ghidra/client.py" = ["E501"]
"tests/integration/test_m5_unpack_live_gate.py" = ["E501"]
"tests/integration/test_m10_ui_drive_gate.py" = ["E501", "B009"]
"tests/integration/test_m11_optional_backends_gate.py" = ["E501", "F841"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["headless_re_mcp"]
follow_imports_for_stubs = true

[[tool.mypy.overrides]]
module = [
  "idapro",
  "ida_auto",
  "ida_hexrays",
  "ida_idaapi",
  "ida_ida",
  "ida_funcs",
  "ida_kernwin",
  "ida_name",
  "ida_nalt",
  "ida_bytes",
  "ida_ua",
  "ida_xref",
  "ida_entry",
  "ida_segment",
  "ida_gdl",
  "ida_typeinf",
  "ida_search",
  "idautils",
  "idc",
  "frida",
  "frida.*",
  "uiautomation",
  "uiautomation.*",
  "numpy",
  "numpy.*",
  "adbutils",
  "adbutils.*",
  "androguard",
  "androguard.*",
  "mitmproxy",
  "mitmproxy.*",
  "playwright",
  "playwright.*",
  # Optional extras / Windows SDKs the quality job does not install.
  # CI uses .[test,dev,web]; PySide6 is the `native` extra and winsdk is
  # probed at runtime for ui.ocr. Without these entries a merge that only
  # touches first-party code still fails mypy on hosted runners.
  "PySide6",
  "PySide6.*",
  "winsdk",
  "winsdk.*",
]
follow_imports = "skip"
ignore_missing_imports = true

# Ghidra executes this inside its own interpreter, which injects currentProgram,
# ARGS and the ghidra.* packages. There is nothing here for mypy to resolve, and
# it is not imported by the package. Ruff exempts it from F821 for the same reason.
[[tool.mypy.overrides]]
module = ["headless_re_mcp.backends.ghidra.scripts.ExportJson"]
ignore_errors = true
