# Windows real-backend gates (M16.2) — self-hosted / authorized runners only.
#
# Manual trigger only: this job needs a self-hosted runner labelled
# [self-hosted, Windows, headless-re] with IDA and the x64dbg headless builds
# installed. A schedule here queues forever and GitHub cancels it after 24h,
# which produced daily cancelled runs and a false impression of nightly
# real-backend coverage. Re-add a schedule once such a runner is registered.
name: windows-integration

on:
  workflow_dispatch:

jobs:
  gates:
    runs-on: [self-hosted, Windows, headless-re]
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7

      - name: Environment sanity
        run: |
          # tests/integration/conftest.py also resolves these from config.json,
          # so accept either source rather than failing a configured runner.
          $required = @(
            "HEADLESS_RE_X64DBG_HEADLESS_X64",
            "HEADLESS_RE_X64DBG_HEADLESS_X86"
          )
          $missing = @($required | Where-Object { -not [Environment]::GetEnvironmentVariable($_) })
          if ($missing.Count -gt 0) {
            python -m pip install -U pip
            python -m pip install -e "."
            $resolved = python -c "from headless_re_mcp.config import Settings; s=Settings.load(); print(int(bool(s.x64dbg_headless_x64 and s.x64dbg_headless_x86)))"
            if ($resolved.Trim() -ne "1") { throw "x64dbg headless not configured via env or config.json: $($missing -join ', ')" }
            Write-Host "x64dbg headless resolved from config.json"
          }
          Write-Host "IDA gate binary optional via HEADLESS_RE_IDA_GATE_BINARY / HEADLESS_RE_IDA_HOME"

      - name: Install
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[test,dev,web]"

      - name: x64dbg headless gates
        run: |
          $env:PYTHONPATH = "src"
          python -m headless_re_mcp gate-xdbg --architecture all

      - name: Build native fixtures
        run: |
          powershell -File .\fixtures\native\build.ps1 -Architecture all

      - name: Record analyzer processes before the gates
        run: |
          # Compared against the same list afterwards so the residue check fails
          # only on processes this job leaked, not on anything the runner was
          # already hosting.
          $names = @("x32dbg", "x64dbg", "ida", "ida64", "idat", "idat64", "headless")
          $before = @(Get-Process -Name $names -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Id)
          $before -join "," | Out-File analyzer_pids_before.txt -Encoding utf8
          Write-Host "pre-existing analyzer processes: $($before.Count)"

      - name: Integration gates
        # Same reason the unit-test steps carry a step timeout: the 90-minute
        # job ceiling cancels the whole job with its logs unrecoverable, so a
        # wedged real-backend gate leaves nothing to say which gate hung. A step
        # timeout fails the step instead, keeping the transcript, and -- because
        # it is below the job ceiling -- still lets the always() Residue check
        # run so a leak from the hung run is caught. Generous under the ceiling:
        # a healthy full-gate run fits well inside 80 minutes, and a run that
        # does not was going to be cancelled at 90 regardless.
        timeout-minutes: 80
        run: |
          # Run every gate rather than a hardcoded subset, which silently omitted
          # newer gates. -rs prints each skip reason so skip never reads as pass.
          $env:PYTHONPATH = "src"
          python -m pytest tests/integration -rs --tb=short

      - name: Residue check
        if: always()
        run: |
          # Was a printed reminder, which nobody reads and which cannot fail.
          $names = @("x32dbg", "x64dbg", "ida", "ida64", "idat", "idat64", "headless")
          $before = @((Get-Content analyzer_pids_before.txt -Raw).Trim() -split "," | Where-Object { $_ })
          $after = @(Get-Process -Name $names -ErrorAction SilentlyContinue)
          $leaked = @($after | Where-Object { $before -notcontains "$($_.Id)" })
          if ($leaked.Count -gt 0) {
            $leaked | ForEach-Object { Write-Host "leaked: $($_.ProcessName) pid=$($_.Id)" }
            throw "gates leaked $($leaked.Count) analyzer process(es)"
          }
          Write-Host "no analyzer processes leaked"
