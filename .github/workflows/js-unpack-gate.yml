# Per-PR JS deobfuscation gate — makes the js.unpack_bundle regression real.
#
# js.unpack_bundle is totally broken under webcrack 2.x: the client pre-creates
# the -o directory (and a direct caller may pass an existing one), and webcrack
# aborts with "output directory already exists" unless -f is passed, so every
# unpack fails. Nothing caught it, because the gate that would
# (tests/integration/test_web_re_gate.py::test_js_unpack_bundle_when_webcrack_present)
# needs webcrack installed, and no CI installs it: ci.yml runs unit tests only,
# and the sole integration workflow (windows-integration.yml) is a manual,
# self-hosted PE job that installs .[test,dev,web] but not Node/webcrack, so the
# JS gates there only ever skip (skip != pass). This job installs Node +
# webcrack and runs the JS gates on Linux so a regression fails here, on the PR,
# instead of shipping.
#
# Deliberately narrow: it runs only the two webcrack-backed cases (js.deobfuscate
# and js.unpack_bundle) and is path-scoped to the JS deobfuscation code, so a PR
# that touches none of it does not pay for the job. The broader non-PE gate set
# (browser, wasm, android, proxy) belongs to a full non-PE integration workflow,
# not here; if that lands, it supersedes this and the overlap is one cheap job.
name: js-unpack-gate

on:
  pull_request:
    paths:
      - "src/headless_re_mcp/backends/jsre/**"
      - "src/headless_re_mcp/core/service_jsre.py"
      - "tests/integration/test_web_re_gate.py"
      - ".github/workflows/js-unpack-gate.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  js-gate:
    # Pinned, not ubuntu-latest: the exact webcrack version this gate was
    # validated against should not shift when the image alias rolls.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # Pin the webcrack the gate was validated on (2.16.0) so an upstream
      # release cannot change the -o/-f contract this job exercises mid-stream.
      WEBCRACK_VERSION: "2.16.0"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install webcrack
        run: npm install -g "webcrack@${WEBCRACK_VERSION}"

      - name: Install package (web extra; no browser needed)
        # The JS gates never launch a browser, so [browser]/Chromium is skipped.
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[test,dev,web]"

      - name: Tool sanity — webcrack must resolve, not skip the gate
        # If webcrack is missing the JS gates skip, and this job would read green
        # on zero coverage. Fail loudly here instead so a broken install cannot
        # masquerade as a pass.
        run: |
          webcrack --version
          python -c "from headless_re_mcp.backends.jsre import JsClient; assert JsClient().available, 'webcrack not found on PATH'; print('webcrack available')"

      - name: JS gates (js.deobfuscate + js.unpack_bundle)
        # -k js_ selects exactly the two webcrack-backed cases and deselects the
        # browser (CDP) and wasm cases, which need tools this job does not
        # install. -rs prints skip reasons so a skip never reads as a pass.
        run: |
          python -m pytest -rs --tb=short --timeout=120 \
            tests/integration/test_web_re_gate.py -k js_
