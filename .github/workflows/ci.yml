# Every-commit quality gate (M16.1) — no proprietary backends required.
name: ci

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: windows-latest
    # A hung backend probe used to burn the full six-hour default before anyone
    # noticed the job was not going to finish.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # requires-python promises 3.11, so 3.11 has to be exercised or the
        # promise is untested.
        python-version: ["3.11", "3.12"]
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[test,dev,web]"

      - name: Ruff
        run: python -m ruff check src tests fixtures openai_bridge.py

      - name: Mypy strict
        run: python -m mypy

      - name: Compileall
        run: python -m compileall -q src

      - name: Pip check
        run: python -m pip check

      - name: Python dependency audit
        run: python -m pip_audit --skip-editable --progress-spinner=off

      - name: Unit tests
        # -rs prints every skip reason: a suite that quietly skips half of
        # itself reads exactly like a suite that passed.
        # A single stuck process-backed test must name itself and fail before
        # the 30-minute job deadline erases the useful per-test context.
        run: python -m pytest tests/unit -q -rs --tb=short --timeout=120 --cov --cov-report=term --cov-report=xml

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: warn

      - name: License and lock consistency
        run: |
          if (-not (Test-Path LICENSE)) { throw "LICENSE missing" }
          $lic = Get-Content LICENSE -Raw
          if ($lic -notmatch "GNU GENERAL PUBLIC LICENSE") { throw "LICENSE is not full GPL-3.0 text" }
          if (-not (Test-Path upstream.lock.json)) { throw "upstream.lock.json missing" }
          Get-Content upstream.lock.json | ConvertFrom-Json | Out-Null
          Write-Host "license+lock ok"

      - name: Config generate smoke
        run: |
          python -m headless_re_mcp config generate --skip-doctor --no-examples | Out-File artifacts_ci_config.json -Encoding utf8
          $j = Get-Content artifacts_ci_config.json -Raw | ConvertFrom-Json
          if (-not $j.ok) { throw "config generate failed" }

      - name: OpenAI tool export smoke
        run: |
          python openai_bridge.py --names-only | Out-File artifacts_ci_openai.json -Encoding utf8
          $j = Get-Content artifacts_ci_openai.json -Raw | ConvertFrom-Json
          if ($j.count -lt 1) { throw "openai bridge exported no tools" }
          Write-Host "openai tools: $($j.count)"

  linux-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[test,dev,web]"

      - name: Ruff
        run: python -m ruff check src tests fixtures openai_bridge.py

      - name: Mypy strict
        run: python -m mypy

      - name: Compileall and dependency check
        run: |
          python -m compileall -q src
          python -m pip check

      - name: Linux unit tests
        run: python -m pytest tests/unit -q -rs --tb=short --cov --cov-report=term

      - name: Doctor and core service smoke
        run: |
          python -m headless_re_mcp doctor --json --strict
          python -c "from headless_re_mcp.core.service import AnalysisService; service = AnalysisService(); assert service.readiness().ok; service.close_all()"
          python -m headless_re_mcp config generate --skip-doctor --no-examples --output artifacts_ci_config.json
          python openai_bridge.py --names-only > artifacts_ci_openai.json

      - name: Build Linux wheel and sdist
        run: |
          python -m pip install build
          python -m build

      - name: License and lock consistency
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          assert "GNU GENERAL PUBLIC LICENSE" in Path("LICENSE").read_text(encoding="utf-8")
          json.loads(Path("upstream.lock.json").read_text(encoding="utf-8"))
          PY

  linux-portable-gates:
    # The Android/Web/proxy/agent-workbench gates skip wherever their tools are
    # missing, so on a bare runner they proved nothing: main carried a proxy
    # that never released its port and a browser gate that could not run off
    # one machine, both invisible to a unit-only lane. Every backend here is
    # free and installable from public indexes (pip/apt/npm) -- no proprietary
    # licenses -- so this lane provisions them and runs those gates for real.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # webcrack needs Node 22 or 24 (see backends/jsre).
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install package and portable backends
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[test,web,android,browser]"
          # mitmproxy is installed alone: its resolver pin (typing-extensions
          # <=4.14 on Python < 3.13) contradicts the >=4.15 pydantic's stack
          # needs, so a combined resolve would backtrack to an older mitmproxy
          # instead of the one operators install today. The newer
          # typing-extensions satisfies both at runtime; restore it after
          # mitmproxy's downgrade.
          python -m pip install "mitmproxy>=11"
          python -m pip install -U "typing-extensions>=4.15"
          python -m playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y wabt radare2 upx-ucl mingw-w64 cmake
          npm install -g webcrack

      - name: Build native PE fixtures (mingw cross-compile)
        # The r2 gate maps addresses against the canonical PE fixture that is
        # normally built on Windows; mingw cross-builds the same CMake targets
        # so the gate runs here too. Building the fixture also arms the
        # conftest's HEADLESS_RE_IDA_GATE_BINARY bridge, which is exactly the
        # fixtures-present/IDA-absent shape where the idalib gate once raised
        # instead of skipping.
        run: |
          cmake -B build-fixtures -S fixtures/native \
            -DCMAKE_SYSTEM_NAME=Windows \
            -DCMAKE_C_COMPILER=x86_64-w64-mingw32-gcc \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build-fixtures
          mkdir -p artifacts/fixtures-x64
          cp build-fixtures/headless_fixture.exe artifacts/fixtures-x64/

      - name: Backends really are present
        # A missing backend makes its gate skip, and a lane whose provisioning
        # broke would read exactly like a lane that passed (skip != pass), so
        # presence is asserted before any gate gets the chance to skip.
        run: |
          python - <<'PY'
          import shutil
          from pathlib import Path

          import adbutils  # noqa: F401
          import androguard  # noqa: F401
          import frida  # noqa: F401
          import mitmproxy  # noqa: F401
          from playwright.sync_api import sync_playwright

          for tool in ("webcrack", "wasm2wat", "wasm-objdump", "r2", "upx"):
              assert shutil.which(tool), f"{tool} is not on PATH"
          assert Path("artifacts/fixtures-x64/headless_fixture.exe").is_file()
          with sync_playwright() as playwright:
              playwright.chromium.launch(headless=True).close()
          print("portable backends present")
          PY

      - name: Portable integration gates
        # -rs prints every skip reason; the expected skips on Linux are the
        # Windows-only handle-count check in the web lifecycle gate and the
        # IDA-backed gates, which must degrade to a skip -- never an error --
        # on a machine that has the fixtures but not IDA.
        run: >-
          python -m pytest
          tests/integration/test_android_re_gate.py
          tests/integration/test_proxy_lifecycle_gate.py
          tests/integration/test_web_lifecycle_gate.py
          tests/integration/test_web_re_gate.py
          tests/integration/test_agent_browser_smoke.py
          tests/integration/test_m11_r2_live_gate.py
          tests/integration/test_idalib_gate.py
          tests/integration/test_m8_static_batch1_gate.py
          tests/integration/test_m8_static_write_gate.py
          tests/integration/test_mcp_static_idalib.py
          -q -rs --tb=short --timeout=180

      - name: Real-UPX unpack fixtures
        # These unit tests skip in the unit lanes because no UPX is installed
        # there; this lane has the real CLI, so the committed packed fixtures
        # are unpacked for real.
        run: >-
          HEADLESS_RE_UPX="$(command -v upx)"
          python -m pytest tests/unit/test_upx_fixtures.py
          -q -rs --tb=short --timeout=180

  webui:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: webui/package-lock.json

      - name: Install
        working-directory: webui
        run: npm ci

      - name: Dependency audit
        working-directory: webui
        run: npm audit --audit-level=high

      - name: Typecheck
        working-directory: webui
        run: npm run typecheck

      - name: Unit tests
        working-directory: webui
        run: npx vitest run

      - name: Build
        working-directory: webui
        run: npm run build

      - name: Committed SPA is not stale
        run: |
          # Vite encodes content in the asset filename, so an added or removed
          # asset means the committed bundle no longer matches webui/src. Pure
          # modifications are ignored because the runner rewrites line endings.
          $changes = @(git status --porcelain -- src/headless_re_mcp/web/spa)
          $structural = @($changes | Where-Object { $_ -notmatch '^.M' -and $_ -notmatch '^M.' })
          if ($structural.Count -gt 0) {
            $changes | ForEach-Object { Write-Host $_ }
            throw "committed SPA is stale - run 'npm run build' in webui and commit src/headless_re_mcp/web/spa"
          }
          Write-Host "committed SPA matches webui/src"
