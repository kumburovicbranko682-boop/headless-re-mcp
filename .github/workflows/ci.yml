# Every-commit quality gate (M16.1) — no proprietary backends required.
name: ci

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: windows-latest
    # A hung backend probe used to burn the full six-hour default before anyone
    # noticed the job was not going to finish.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # requires-python promises 3.11, so 3.11 has to be exercised or the
        # promise is untested.
        python-version: ["3.11", "3.12"]
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[test,dev,web]"

      - name: Ruff
        run: python -m ruff check src tests fixtures openai_bridge.py

      - name: Mypy strict
        run: python -m mypy

      - name: Compileall
        run: python -m compileall -q src

      - name: Pip check
        run: python -m pip check

      - name: Python dependency audit
        run: python -m pip_audit --skip-editable --progress-spinner=off

      - name: Unit tests
        # -rs prints every skip reason: a suite that quietly skips half of
        # itself reads exactly like a suite that passed.
        # A single stuck process-backed test must name itself and fail before
        # the 30-minute job deadline erases the useful per-test context.
        # The step timeout exists because the job timeout has been observed to
        # cancel the whole job with its logs unrecoverable; failing the step
        # instead keeps the transcript and still uploads coverage.
        timeout-minutes: 25
        run: python -m pytest tests/unit -q -rs --tb=short --timeout=120 --cov --cov-report=term --cov-report=xml

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: warn

      - name: License and lock consistency
        run: |
          if (-not (Test-Path LICENSE)) { throw "LICENSE missing" }
          $lic = Get-Content LICENSE -Raw
          if ($lic -notmatch "GNU GENERAL PUBLIC LICENSE") { throw "LICENSE is not full GPL-3.0 text" }
          if (-not (Test-Path upstream.lock.json)) { throw "upstream.lock.json missing" }
          Get-Content upstream.lock.json | ConvertFrom-Json | Out-Null
          Write-Host "license+lock ok"

      - name: Config generate smoke
        run: |
          python -m headless_re_mcp config generate --skip-doctor --no-examples | Out-File artifacts_ci_config.json -Encoding utf8
          $j = Get-Content artifacts_ci_config.json -Raw | ConvertFrom-Json
          if (-not $j.ok) { throw "config generate failed" }

      - name: OpenAI tool export smoke
        run: |
          python openai_bridge.py --names-only | Out-File artifacts_ci_openai.json -Encoding utf8
          $j = Get-Content artifacts_ci_openai.json -Raw | ConvertFrom-Json
          if ($j.count -lt 1) { throw "openai bridge exported no tools" }
          Write-Host "openai tools: $($j.count)"

  linux-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[test,dev,web]"

      - name: Ruff
        run: python -m ruff check src tests fixtures openai_bridge.py

      - name: Mypy strict
        run: python -m mypy

      - name: Compileall and dependency check
        run: |
          python -m compileall -q src
          python -m pip check

      - name: Linux unit tests
        # Same per-test and step bounds as the Windows job: a hung test names
        # itself, and a wedged step fails with its logs instead of the job
        # timeout cancelling the whole job and losing them.
        timeout-minutes: 20
        run: python -m pytest tests/unit -q -rs --tb=short --timeout=120 --cov --cov-report=term

      - name: Doctor and core service smoke
        run: |
          python -m headless_re_mcp doctor --json --strict
          python -c "from headless_re_mcp.core.service import AnalysisService; service = AnalysisService(); assert service.readiness().ok; service.close_all()"
          python -m headless_re_mcp config generate --skip-doctor --no-examples --output artifacts_ci_config.json
          python openai_bridge.py --names-only > artifacts_ci_openai.json

      - name: Build Linux wheel and sdist
        run: |
          python -m pip install build
          python -m build

      - name: License and lock consistency
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          assert "GNU GENERAL PUBLIC LICENSE" in Path("LICENSE").read_text(encoding="utf-8")
          json.loads(Path("upstream.lock.json").read_text(encoding="utf-8"))
          PY

  # The integration gates encode the contracts the unit suite cannot see
  # (real mitmproxy binds a port, real chromium drives the workbench, real
  # androguard opens an APK, real webcrack/wabt process a fixture) -- and
  # until this lane existed no CI job ran them at all, so they rotted
  # invisibly on machines nobody had. Windows backend gates (x64dbg / IDA /
  # Win32 UI) and gates that need IDA (idalib) still skip here by design;
  # the -rs listing keeps every skip visible so skip != pass stays
  # auditable.
  linux-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      WABT_VERSION: "1.0.36"
      R2_VERSION: "6.2.0"
      JADX_VERSION: "1.5.6"
      APKTOOL_VERSION: "3.0.3"
      GHIDRA_VERSION: "12.1.3"
      GHIDRA_RELEASE: "Ghidra_12.1.3_build"
      GHIDRA_ASSET: "ghidra_12.1.3_PUBLIC_20260817.zip"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install package with optional backends
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[test,web,android,proxy,browser]"

      - name: Install chromium for the browser gates
        run: python -m playwright install --with-deps chromium

      - name: Install webcrack and wabt for the JS/WASM gates
        run: |
          npm install -g webcrack
          curl -fsSL -o /tmp/wabt.tar.gz \
            "https://github.com/WebAssembly/wabt/releases/download/${WABT_VERSION}/wabt-${WABT_VERSION}-ubuntu-20.04.tar.gz"
          tar -xzf /tmp/wabt.tar.gz -C /tmp
          echo "/tmp/wabt-${WABT_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Install radare2 for the r2 gate
        run: |
          curl -fsSL -o /tmp/radare2.deb \
            "https://github.com/radareorg/radare2/releases/download/${R2_VERSION}/radare2_${R2_VERSION}_amd64.deb"
          sudo dpkg -i /tmp/radare2.deb

      - name: Install jadx for the Android decompile gate
        run: |
          curl -fsSL -o /tmp/jadx.zip \
            "https://github.com/skylot/jadx/releases/download/v${JADX_VERSION}/jadx-${JADX_VERSION}.zip"
          unzip -oq /tmp/jadx.zip -d /tmp/jadx
          chmod +x /tmp/jadx/bin/jadx
          echo "/tmp/jadx/bin" >> "$GITHUB_PATH"

      - name: Install apktool for the Android repack gate
        run: |
          mkdir -p /tmp/apktoolbin
          curl -fsSL -o /tmp/apktoolbin/apktool.jar \
            "https://github.com/iBotPeaches/Apktool/releases/download/v${APKTOOL_VERSION}/apktool_${APKTOOL_VERSION}.jar"
          printf '#!/bin/sh\nexec java -jar /tmp/apktoolbin/apktool.jar "$@"\n' > /tmp/apktoolbin/apktool
          chmod +x /tmp/apktoolbin/apktool
          echo "/tmp/apktoolbin" >> "$GITHUB_PATH"

      - name: Install apksigner and monodis for the Android sign / .NET cross-check gates
        # apksigner's standalone package is just apksigner.jar plus a wrapper (a
        # few MB), not the whole Android SDK; the sign gate builds the debug
        # keystore itself with keytool from the JDK above. mono-utils supplies
        # monodis (an independent ECMA-335 parser the metadata gate cross-checks
        # the pure-Python reader against) and pedump (which decodes the CLI
        # header, so the corflags gate cross-checks il_only/32-bit/strong-name).
        run: sudo apt-get update && sudo apt-get install -y apksigner mono-utils

      - name: Install Ghidra for the headless analysis gate
        run: |
          curl -fsSL -o /tmp/ghidra.zip \
            "https://github.com/NationalSecurityAgency/ghidra/releases/download/${GHIDRA_RELEASE}/${GHIDRA_ASSET}"
          unzip -oq /tmp/ghidra.zip -d /tmp/ghidra
          echo "HEADLESS_RE_GHIDRA_HOME=/tmp/ghidra/ghidra_${GHIDRA_VERSION}_PUBLIC" >> "$GITHUB_ENV"

      - name: Allow local frida injection for the frida local gate
        # Ubuntu runners ship kernel.yama.ptrace_scope=1, under which a tracer
        # may only attach to its descendants. frida's local injector is a
        # sibling of the target, so the frida local gate would skip unless this
        # is relaxed. gdb/strace-based CI jobs do the same. The gate still skips
        # (never fails) if the kernel refuses, so this only turns a skip into a
        # real run where the sandbox permits it.
        run: |
          echo 0 | sudo tee /proc/sys/kernel/yama/ptrace_scope
          cat /proc/sys/kernel/yama/ptrace_scope

      - name: Linux integration gates
        run: python -m pytest tests/integration -q -rs --tb=short --timeout=300

  webui:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: webui/package-lock.json

      - name: Install
        working-directory: webui
        run: npm ci

      - name: Dependency audit
        working-directory: webui
        run: npm audit --audit-level=high

      - name: Typecheck
        working-directory: webui
        run: npm run typecheck

      - name: Unit tests
        working-directory: webui
        run: npx vitest run

      - name: Build
        working-directory: webui
        run: npm run build

      - name: Committed SPA is not stale
        run: |
          # Vite encodes content in the asset filename, so an added or removed
          # asset means the committed bundle no longer matches webui/src. Pure
          # modifications are ignored because the runner rewrites line endings.
          $changes = @(git status --porcelain -- src/headless_re_mcp/web/spa)
          $structural = @($changes | Where-Object { $_ -notmatch '^.M' -and $_ -notmatch '^M.' })
          if ($structural.Count -gt 0) {
            $changes | ForEach-Object { Write-Host $_ }
            throw "committed SPA is stale - run 'npm run build' in webui and commit src/headless_re_mcp/web/spa"
          }
          Write-Host "committed SPA matches webui/src"
