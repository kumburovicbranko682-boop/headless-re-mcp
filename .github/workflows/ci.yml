# Every-commit quality gate (M16.1) — no proprietary backends required.
name: ci

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: windows-latest
    # A hung backend probe used to burn the full six-hour default before anyone
    # noticed the job was not going to finish.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # requires-python promises 3.11, so 3.11 has to be exercised or the
        # promise is untested.
        python-version: ["3.11", "3.12"]
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[test,dev,web]"

      - name: Ruff
        run: python -m ruff check src tests fixtures openai_bridge.py

      - name: Mypy strict
        run: python -m mypy

      - name: Compileall
        run: python -m compileall -q src

      - name: Pip check
        run: python -m pip check

      - name: Python dependency audit
        run: python -m pip_audit --skip-editable --progress-spinner=off

      - name: Unit tests
        # -rs prints every skip reason: a suite that quietly skips half of
        # itself reads exactly like a suite that passed.
        # A single stuck process-backed test must name itself and fail before
        # the 30-minute job deadline erases the useful per-test context.
        run: python -m pytest tests/unit -q -rs --tb=short --timeout=120 --cov --cov-report=term --cov-report=xml

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: warn

      - name: License and lock consistency
        run: |
          if (-not (Test-Path LICENSE)) { throw "LICENSE missing" }
          $lic = Get-Content LICENSE -Raw
          if ($lic -notmatch "GNU GENERAL PUBLIC LICENSE") { throw "LICENSE is not full GPL-3.0 text" }
          if (-not (Test-Path upstream.lock.json)) { throw "upstream.lock.json missing" }
          Get-Content upstream.lock.json | ConvertFrom-Json | Out-Null
          Write-Host "license+lock ok"

      - name: Config generate smoke
        run: |
          python -m headless_re_mcp config generate --skip-doctor --no-examples | Out-File artifacts_ci_config.json -Encoding utf8
          $j = Get-Content artifacts_ci_config.json -Raw | ConvertFrom-Json
          if (-not $j.ok) { throw "config generate failed" }

      - name: OpenAI tool export smoke
        run: |
          python openai_bridge.py --names-only | Out-File artifacts_ci_openai.json -Encoding utf8
          $j = Get-Content artifacts_ci_openai.json -Raw | ConvertFrom-Json
          if ($j.count -lt 1) { throw "openai bridge exported no tools" }
          Write-Host "openai tools: $($j.count)"

  linux-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[test,dev,web]"

      - name: Ruff
        run: python -m ruff check src tests fixtures openai_bridge.py

      - name: Mypy strict
        run: python -m mypy

      - name: Compileall and dependency check
        run: |
          python -m compileall -q src
          python -m pip check

      - name: Linux unit tests
        run: python -m pytest tests/unit -q -rs --tb=short --cov --cov-report=term

      - name: Doctor and core service smoke
        run: |
          python -m headless_re_mcp doctor --json --strict
          python -c "from headless_re_mcp.core.service import AnalysisService; service = AnalysisService(); assert service.readiness().ok; service.close_all()"
          python -m headless_re_mcp config generate --skip-doctor --no-examples --output artifacts_ci_config.json
          python openai_bridge.py --names-only > artifacts_ci_openai.json

      - name: Build Linux wheel and sdist
        run: |
          python -m pip install build
          python -m build

      - name: License and lock consistency
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          assert "GNU GENERAL PUBLIC LICENSE" in Path("LICENSE").read_text(encoding="utf-8")
          json.loads(Path("upstream.lock.json").read_text(encoding="utf-8"))
          PY

  linux-integration:
    # Real-backend gates for the portable lines (Web, Android, HTTP(S) proxy,
    # radare2, Ghidra). These backends install on a stock GitHub-hosted runner,
    # so unlike the Windows debugger gates they can run on every commit rather
    # than only on the manual self-hosted job -- which is what keeps "skip !=
    # pass" honest for the non-PE lines instead of letting them rot untested off
    # Windows.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # Ghidra 11.2.x requires JDK 21; the Jython export script runs inside it.
          java-version: "21"

      - name: Install portable backends (radare2, wabt, webcrack)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends radare2 wabt
          sudo npm install -g webcrack

      - name: Cache Ghidra
        id: cache-ghidra
        uses: actions/cache@v4
        with:
          path: ~/ghidra
          # 11.2.1 is the last line that bundles Jython, which ExportJson.py needs;
          # 11.3+ dropped it for PyGhidra. Bump the key with the version when moving.
          key: ghidra-11.2.1-public

      - name: Install Ghidra
        if: steps.cache-ghidra.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/ghidra
          curl -fsSL -o /tmp/ghidra.zip \
            https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_11.2.1_build/ghidra_11.2.1_PUBLIC_20241105.zip
          unzip -q /tmp/ghidra.zip -d ~/ghidra
          rm /tmp/ghidra.zip

      - name: Point the Ghidra gate at the install
        run: echo "HEADLESS_RE_GHIDRA_HOME=$HOME/ghidra/ghidra_11.2.1_PUBLIC" >> "$GITHUB_ENV"

      - name: Cache Android decompile tools (jadx, r8)
        id: cache-android-tools
        uses: actions/cache@v4
        with:
          path: ~/android-tools
          key: android-tools-jadx-1.5.1-r8-8.5.35

      - name: Install jadx and r8/d8
        if: steps.cache-android-tools.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/android-tools/jadx
          curl -fsSL -o /tmp/jadx.zip \
            https://github.com/skylot/jadx/releases/download/v1.5.1/jadx-1.5.1.zip
          unzip -q /tmp/jadx.zip -d ~/android-tools/jadx
          rm /tmp/jadx.zip
          # r8.jar ships the D8 dexer; the gate uses it to build a real classes.dex
          # from compiled Java, so the decompile leg runs against a genuine DEX.
          curl -fsSL -o ~/android-tools/r8.jar \
            https://maven.google.com/com/android/tools/r8/8.5.35/r8-8.5.35.jar

      - name: Point the Android decompile gate at jadx and r8
        run: |
          chmod +x "$HOME/android-tools/jadx/bin/jadx"
          echo "HEADLESS_RE_JADX=$HOME/android-tools/jadx/bin/jadx" >> "$GITHUB_ENV"
          echo "HEADLESS_RE_R8_JAR=$HOME/android-tools/r8.jar" >> "$GITHUB_ENV"

      - name: Install package with portable extras
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[test,dev,web,android,browser,proxy]"

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Backend sanity
        run: |
          r2 -v
          wasm2wat --version
          webcrack --version
          "$HEADLESS_RE_GHIDRA_HOME/support/analyzeHeadless" -help >/dev/null 2>&1 || true
          test -x "$HEADLESS_RE_GHIDRA_HOME/support/analyzeHeadless" && echo "ghidra analyzeHeadless present"
          "$HEADLESS_RE_JADX" --version
          javac -version
          python -c "import androguard, adbutils, mitmproxy, playwright; print('android/proxy/web imports ok')"

      - name: Non-PE integration gates
        # The whole tree runs, not a hardcoded subset, so a newly added portable
        # gate is picked up rather than silently omitted. The PE/IDA/Windows gates
        # skip cleanly here -- no IDA, no x64dbg, and conftest marks the
        # Windows-only modules -- while the Web/Android/proxy/radare2 gates run for
        # real. -rs prints every skip reason so a quiet skip never reads as a pass.
        run: python -m pytest tests/integration -rs --tb=short --timeout=300

  webui:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: webui/package-lock.json

      - name: Install
        working-directory: webui
        run: npm ci

      - name: Dependency audit
        working-directory: webui
        run: npm audit --audit-level=high

      - name: Typecheck
        working-directory: webui
        run: npm run typecheck

      - name: Unit tests
        working-directory: webui
        run: npx vitest run

      - name: Build
        working-directory: webui
        run: npm run build

      - name: Committed SPA is not stale
        run: |
          # Vite encodes content in the asset filename, so an added or removed
          # asset means the committed bundle no longer matches webui/src. Pure
          # modifications are ignored because the runner rewrites line endings.
          $changes = @(git status --porcelain -- src/headless_re_mcp/web/spa)
          $structural = @($changes | Where-Object { $_ -notmatch '^.M' -and $_ -notmatch '^M.' })
          if ($structural.Count -gt 0) {
            $changes | ForEach-Object { Write-Host $_ }
            throw "committed SPA is stale - run 'npm run build' in webui and commit src/headless_re_mcp/web/spa"
          }
          Write-Host "committed SPA matches webui/src"
