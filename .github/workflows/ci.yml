# Every-commit quality gate (M16.1) — no proprietary backends required.
name: ci

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: windows-latest
    # A hung backend probe used to burn the full six-hour default before anyone
    # noticed the job was not going to finish.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # requires-python promises 3.11, so 3.11 has to be exercised or the
        # promise is untested.
        python-version: ["3.11", "3.12"]
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[test,dev,web]"

      - name: Ruff
        run: python -m ruff check src tests fixtures openai_bridge.py

      - name: Mypy strict
        run: python -m mypy

      - name: Compileall
        run: python -m compileall -q src

      - name: Pip check
        run: python -m pip check

      - name: Python dependency audit
        run: python -m pip_audit --skip-editable --progress-spinner=off

      - name: Unit tests
        # -rs prints every skip reason: a suite that quietly skips half of
        # itself reads exactly like a suite that passed.
        # A single stuck process-backed test must name itself and fail before
        # the 30-minute job deadline erases the useful per-test context.
        # The step timeout exists because the job timeout has been observed to
        # cancel the whole job with its logs unrecoverable; failing the step
        # instead keeps the transcript and still uploads coverage.
        timeout-minutes: 25
        run: python -m pytest tests/unit -q -rs --tb=short --timeout=120 --cov --cov-report=term --cov-report=xml

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: warn

      - name: License and lock consistency
        run: |
          if (-not (Test-Path LICENSE)) { throw "LICENSE missing" }
          $lic = Get-Content LICENSE -Raw
          if ($lic -notmatch "GNU GENERAL PUBLIC LICENSE") { throw "LICENSE is not full GPL-3.0 text" }
          if (-not (Test-Path upstream.lock.json)) { throw "upstream.lock.json missing" }
          Get-Content upstream.lock.json | ConvertFrom-Json | Out-Null
          Write-Host "license+lock ok"

      - name: Config generate smoke
        run: |
          python -m headless_re_mcp config generate --skip-doctor --no-examples | Out-File artifacts_ci_config.json -Encoding utf8
          $j = Get-Content artifacts_ci_config.json -Raw | ConvertFrom-Json
          if (-not $j.ok) { throw "config generate failed" }

      - name: OpenAI tool export smoke
        run: |
          python openai_bridge.py --names-only | Out-File artifacts_ci_openai.json -Encoding utf8
          $j = Get-Content artifacts_ci_openai.json -Raw | ConvertFrom-Json
          if ($j.count -lt 1) { throw "openai bridge exported no tools" }
          Write-Host "openai tools: $($j.count)"

  linux-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[test,dev,web]"

      - name: Ruff
        run: python -m ruff check src tests fixtures openai_bridge.py

      - name: Mypy strict
        run: python -m mypy

      - name: Compileall and dependency check
        run: |
          python -m compileall -q src
          python -m pip check

      - name: Linux unit tests
        # Same per-test and step bounds as the Windows job: a hung test names
        # itself, and a wedged step fails with its logs instead of the job
        # timeout cancelling the whole job and losing them.
        timeout-minutes: 20
        run: python -m pytest tests/unit -q -rs --tb=short --timeout=120 --cov --cov-report=term

      - name: Doctor and core service smoke
        run: |
          python -m headless_re_mcp doctor --json --strict
          python -c "from headless_re_mcp.core.service import AnalysisService; service = AnalysisService(); assert service.readiness().ok; service.close_all()"
          python -m headless_re_mcp config generate --skip-doctor --no-examples --output artifacts_ci_config.json
          python openai_bridge.py --names-only > artifacts_ci_openai.json

      - name: Build Linux wheel and sdist
        run: |
          python -m pip install build
          python -m build

      - name: License and lock consistency
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          assert "GNU GENERAL PUBLIC LICENSE" in Path("LICENSE").read_text(encoding="utf-8")
          json.loads(Path("upstream.lock.json").read_text(encoding="utf-8"))
          PY

  # The non-PE lines (Android, Web, proxy) ship integration Gates that drive
  # real open-source tools -- androguard, jadx, apktool, apksigner,
  # Playwright/Chromium, webcrack, wabt, mitmproxy -- against committed fixtures.
  # The unit jobs never
  # run tests/integration, so those Gates otherwise only ever execute on a
  # developer's machine and silently rot when a backend's CLI or API drifts.
  # This job installs that toolchain on Linux and runs exactly the Gates it can
  # satisfy hermetically (no device, no proprietary backend), turning "skips on
  # a bare runner" into an enforced check. The PE Gates are left out on purpose:
  # they need IDA/Ghidra/x64dbg/WinDbg, which no hosted runner has.
  linux-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Pinned so a silently-yanked "latest" cannot turn the Gate green by
      # making a tool absent (absent tool => skip, and skip reads like pass).
      JADX_VERSION: "1.5.3"
      APKTOOL_VERSION: "2.9.3"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      # jadx and apktool need a JRE; the ubuntu-latest image already ships one
      # on PATH, and the "Verify the toolchain" step fails loudly if that ever
      # stops being true, so no setup-java action is pinned here.

      - name: Install package with the non-PE extras
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[test,dev,web,android,browser,proxy]"

      - name: Install Chromium for Playwright
        run: python -m playwright install --with-deps chromium

      - name: Install JS/WASM and Android signing tools (webcrack, wabt, apksigner)
        run: |
          npm install -g webcrack
          sudo apt-get update
          sudo apt-get install -y wabt apksigner

      - name: Install Android CLI tools (jadx, apktool)
        run: |
          set -euo pipefail
          mkdir -p "$HOME/tools/bin" "$HOME/tools/jadx"
          curl -fsSL -o /tmp/jadx.zip \
            "https://github.com/skylot/jadx/releases/download/v${JADX_VERSION}/jadx-${JADX_VERSION}.zip"
          unzip -q -o /tmp/jadx.zip -d "$HOME/tools/jadx"
          ln -sf "$HOME/tools/jadx/bin/jadx" "$HOME/tools/bin/jadx"
          curl -fsSL -o "$HOME/tools/bin/apktool.jar" \
            "https://github.com/iBotPeaches/Apktool/releases/download/v${APKTOOL_VERSION}/apktool_${APKTOOL_VERSION}.jar"
          printf '#!/usr/bin/env bash\nexec java -jar "%s/apktool.jar" "$@"\n' "$HOME/tools/bin" \
            > "$HOME/tools/bin/apktool"
          chmod +x "$HOME/tools/bin/apktool"
          echo "$HOME/tools/bin" >> "$GITHUB_PATH"

      - name: Verify the toolchain wired up
        # A Gate that skips because its tool is missing looks identical to a
        # Gate that passed. This step fails loudly if anything this job promised
        # to provide is not actually runnable, so a broken install cannot hide
        # behind a green "skipped" Gate.
        run: |
          set -euo pipefail
          jadx --version
          apktool --version
          apksigner --version
          webcrack --version
          wasm2wat --version
          python - <<'PY'
          import importlib
          for name in ("androguard", "mitmproxy", "playwright"):
              importlib.import_module(name)
          from playwright.sync_api import sync_playwright
          with sync_playwright() as pw:
              assert pw.chromium.executable_path, "chromium not installed"
          print("toolchain OK")
          PY

      - name: Non-PE integration Gates
        # Explicit file list, not "-m integration": the marker also covers the
        # PE Gates that need proprietary backends. These are the lines this job
        # can satisfy end to end. -rs surfaces every remaining skip reason so a
        # newly-dormant Gate is visible in the log rather than silently green.
        timeout-minutes: 20
        run: |
          python -m pytest \
            tests/integration/test_android_re_gate.py \
            tests/integration/test_web_re_gate.py \
            tests/integration/test_web_cdp_gate.py \
            tests/integration/test_web_lifecycle_gate.py \
            tests/integration/test_proxy_lifecycle_gate.py \
            tests/integration/test_proxy_capture_gate.py \
            tests/integration/test_agent_browser_smoke.py \
            -q -rs --tb=short --timeout=300

  webui:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: webui/package-lock.json

      - name: Install
        working-directory: webui
        run: npm ci

      - name: Dependency audit
        working-directory: webui
        run: npm audit --audit-level=high

      - name: Typecheck
        working-directory: webui
        run: npm run typecheck

      - name: Unit tests
        working-directory: webui
        run: npx vitest run

      - name: Build
        working-directory: webui
        run: npm run build

      - name: Committed SPA is not stale
        run: |
          # Vite encodes content in the asset filename, so an added or removed
          # asset means the committed bundle no longer matches webui/src. Pure
          # modifications are ignored because the runner rewrites line endings.
          $changes = @(git status --porcelain -- src/headless_re_mcp/web/spa)
          $structural = @($changes | Where-Object { $_ -notmatch '^.M' -and $_ -notmatch '^M.' })
          if ($structural.Count -gt 0) {
            $changes | ForEach-Object { Write-Host $_ }
            throw "committed SPA is stale - run 'npm run build' in webui and commit src/headless_re_mcp/web/spa"
          }
          Write-Host "committed SPA matches webui/src"
