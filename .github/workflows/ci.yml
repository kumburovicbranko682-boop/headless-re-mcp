# Every-commit quality gate (M16.1) — no proprietary backends required.
name: ci

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: windows-latest
    # A hung backend probe used to burn the full six-hour default before anyone
    # noticed the job was not going to finish.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # requires-python promises 3.11, so 3.11 has to be exercised or the
        # promise is untested.
        python-version: ["3.11", "3.12"]
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[test,dev,web]"

      - name: Ruff
        run: python -m ruff check src tests fixtures openai_bridge.py

      - name: Mypy strict
        run: python -m mypy

      - name: Compileall
        run: python -m compileall -q src

      - name: Pip check
        run: python -m pip check

      - name: Python dependency audit
        run: python -m pip_audit --skip-editable --progress-spinner=off

      - name: Unit tests
        # -rs prints every skip reason: a suite that quietly skips half of
        # itself reads exactly like a suite that passed.
        # A single stuck process-backed test must name itself and fail before
        # the 30-minute job deadline erases the useful per-test context.
        run: python -m pytest tests/unit -q -rs --tb=short --timeout=120 --cov --cov-report=term --cov-report=xml

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: warn

      - name: License and lock consistency
        run: |
          if (-not (Test-Path LICENSE)) { throw "LICENSE missing" }
          $lic = Get-Content LICENSE -Raw
          if ($lic -notmatch "GNU GENERAL PUBLIC LICENSE") { throw "LICENSE is not full GPL-3.0 text" }
          if (-not (Test-Path upstream.lock.json)) { throw "upstream.lock.json missing" }
          Get-Content upstream.lock.json | ConvertFrom-Json | Out-Null
          Write-Host "license+lock ok"

      - name: Config generate smoke
        run: |
          python -m headless_re_mcp config generate --skip-doctor --no-examples | Out-File artifacts_ci_config.json -Encoding utf8
          $j = Get-Content artifacts_ci_config.json -Raw | ConvertFrom-Json
          if (-not $j.ok) { throw "config generate failed" }

      - name: OpenAI tool export smoke
        run: |
          python openai_bridge.py --names-only | Out-File artifacts_ci_openai.json -Encoding utf8
          $j = Get-Content artifacts_ci_openai.json -Raw | ConvertFrom-Json
          if ($j.count -lt 1) { throw "openai bridge exported no tools" }
          Write-Host "openai tools: $($j.count)"

  linux-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[test,dev,web]"

      - name: Ruff
        run: python -m ruff check src tests fixtures openai_bridge.py

      - name: Mypy strict
        run: python -m mypy

      - name: Compileall and dependency check
        run: |
          python -m compileall -q src
          python -m pip check

      - name: Linux unit tests
        run: python -m pytest tests/unit -q -rs --tb=short --cov --cov-report=term

      - name: Doctor and core service smoke
        run: |
          python -m headless_re_mcp doctor --json --strict
          python -c "from headless_re_mcp.core.service import AnalysisService; service = AnalysisService(); assert service.readiness().ok; service.close_all()"
          python -m headless_re_mcp config generate --skip-doctor --no-examples --output artifacts_ci_config.json
          python openai_bridge.py --names-only > artifacts_ci_openai.json

      - name: Build Linux wheel and sdist
        run: |
          python -m pip install build
          python -m build

      - name: License and lock consistency
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          assert "GNU GENERAL PUBLIC LICENSE" in Path("LICENSE").read_text(encoding="utf-8")
          json.loads(Path("upstream.lock.json").read_text(encoding="utf-8"))
          PY

  # skip != pass: the Android, Web (JS/WASM/CDP), radare2 and proxy lines only
  # prove anything when their backends are present, and every other job runs on
  # Windows or installs only .[test,dev,web], so those gates skip everywhere and
  # a regression in them goes unnoticed. This job installs the portable,
  # non-proprietary backends and runs their gates on Linux so those lines are
  # exercised on every commit. Proprietary/live parts (IDA, x64dbg, WinDbg, a
  # real device or emulator) still self-skip with a reason.
  linux-nonpe-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # The Jython post-script only runs on a Ghidra that still bundles Jython.
    env:
      GHIDRA_VERSION: "11.2.1"
      GHIDRA_DIST: "ghidra_11.2.1_PUBLIC_20241105"
      JADX_VERSION: "1.5.6"
      APKTOOL_VERSION: "3.0.3"
      BUILD_TOOLS_ZIP: "build-tools_r34-linux.zip"
      BUILD_TOOLS_DIR: "android-14"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          # One interpreter is enough: these gates drive external binaries and
          # subprocesses, so they are effectively Python-version agnostic, and a
          # browser + apt + npm install per version is not worth doubling.
          python-version: "3.12"

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install system backends (radare2, wabt, arm + mingw cross toolchains)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends radare2 wabt \
            gcc-aarch64-linux-gnu libc6-dev-arm64-cross \
            gcc-arm-linux-gnueabihf libc6-dev-armhf-cross \
            gcc-mingw-w64-x86-64

      - name: Install webcrack (JS deobfuscation)
        run: npm install -g webcrack

      - name: Install package with the portable backends
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[test,dev,web,browser,proxy,android]"

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Cache Ghidra
        id: cache-ghidra
        uses: actions/cache@v4
        with:
          path: ~/ghidra
          key: ghidra-${{ env.GHIDRA_VERSION }}

      - name: Install Ghidra
        # ExportJson.py is a Jython post-script. Ghidra 11.3+ dropped the bundled
        # Jython interpreter for PyGhidra, so pin the last release that still runs
        # .py post-scripts out of the box until the script is ported to PyGhidra.
        if: steps.cache-ghidra.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/ghidra
          curl -fsSL -o /tmp/ghidra.zip \
            "https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_${GHIDRA_VERSION}_build/${GHIDRA_DIST}.zip"
          unzip -q /tmp/ghidra.zip -d ~/ghidra

      - name: Point at Ghidra
        run: echo "HEADLESS_RE_GHIDRA_HOME=$HOME/ghidra/ghidra_${GHIDRA_VERSION}_PUBLIC" >> "$GITHUB_ENV"

      - name: Install jadx, apktool and apksigner (Android tools)
        # All Java CLIs (the JDK is already set up above). jadx decompiles
        # jar/dex/apk; apktool bundles its own aapt2 so it builds/decodes a
        # framework-free APK without the Android SDK. apksigner ships in the
        # Android build-tools zip (pulled directly, no sdkmanager) so the
        # build -> sign -> verify gate runs for real; the capability_unavailable
        # degrade path stays covered by the unit tests.
        run: |
          curl -fsSL -o /tmp/jadx.zip \
            "https://github.com/skylot/jadx/releases/download/v${JADX_VERSION}/jadx-${JADX_VERSION}.zip"
          mkdir -p "$HOME/jadx"
          unzip -q /tmp/jadx.zip -d "$HOME/jadx"
          chmod +x "$HOME/jadx/bin/jadx"
          mkdir -p "$HOME/apktool"
          curl -fsSL -o "$HOME/apktool/apktool.jar" \
            "https://github.com/iBotPeaches/Apktool/releases/download/v${APKTOOL_VERSION}/apktool_${APKTOOL_VERSION}.jar"
          printf '#!/bin/sh\nexec java -jar %s/apktool/apktool.jar "$@"\n' "$HOME" > "$HOME/apktool/apktool"
          chmod +x "$HOME/apktool/apktool"
          curl -fsSL -o /tmp/build-tools.zip \
            "https://dl.google.com/android/repository/${BUILD_TOOLS_ZIP}"
          mkdir -p "$HOME/android-build-tools"
          unzip -q /tmp/build-tools.zip -d "$HOME/android-build-tools"
          echo "HEADLESS_RE_JADX=$HOME/jadx/bin/jadx" >> "$GITHUB_ENV"
          echo "HEADLESS_RE_APKTOOL=$HOME/apktool/apktool" >> "$GITHUB_ENV"
          echo "HEADLESS_RE_APKSIGNER=$HOME/android-build-tools/${BUILD_TOOLS_DIR}/apksigner" >> "$GITHUB_ENV"

      - name: Backends are discoverable (skip != pass)
        # If a backend is not actually reachable its gate would skip and read as
        # a pass. Fail loudly here instead so a broken install is fixed rather
        # than silently hollowing out this job.
        run: |
          set -e
          for tool in r2 wat2wasm wasm2wat webcrack cc java x86_64-w64-mingw32-gcc; do
            command -v "$tool" >/dev/null || { echo "::error::$tool not on PATH"; exit 1; }
          done
          test -x "$HEADLESS_RE_GHIDRA_HOME/support/analyzeHeadless" \
            || { echo "::error::ghidra analyzeHeadless missing at $HEADLESS_RE_GHIDRA_HOME"; exit 1; }
          test -x "$HEADLESS_RE_JADX" || { echo "::error::jadx missing at $HEADLESS_RE_JADX"; exit 1; }
          test -x "$HEADLESS_RE_APKTOOL" || { echo "::error::apktool missing at $HEADLESS_RE_APKTOOL"; exit 1; }
          test -x "$HEADLESS_RE_APKSIGNER" || { echo "::error::apksigner missing at $HEADLESS_RE_APKSIGNER"; exit 1; }
          python -c "import mitmproxy, playwright, androguard, adbutils, frida; print('python backends importable')"

      - name: Non-PE backend gates
        # -rs prints every skip reason: a gate that quietly skips (its backend
        # vanished) must be visible, not indistinguishable from a pass. The
        # Linux-native parts run for real; live-device and Windows-only parts
        # self-skip with a reason.
        run: |
          python -m pytest \
            tests/integration/test_proxy_lifecycle_gate.py \
            tests/integration/test_proxy_capture_gate.py \
            tests/integration/test_proxy_flow_body_spill_gate.py \
            tests/integration/test_proxy_https_gate.py \
            tests/integration/test_proxy_replay_gate.py \
            tests/integration/test_proxy_headers_and_omit_gate.py \
            tests/integration/test_web_re_gate.py \
            tests/integration/test_js_bundle_graph_gate.py \
            tests/integration/test_web_js_deobfuscate_gate.py \
            tests/integration/test_web_lifecycle_gate.py \
            tests/integration/test_web_navigate_gate.py \
            tests/integration/test_web_cdp_gate.py \
            tests/integration/test_web_cdp_https_gate.py \
            tests/integration/test_web_proxy_https_chain_gate.py \
            tests/integration/test_web_proxy_error_gate.py \
            tests/integration/test_web_navigate_proxy_gate.py \
            tests/integration/test_web_network_get_gate.py \
            tests/integration/test_web_har_export_gate.py \
            tests/integration/test_web_wasm_gate.py \
            tests/integration/test_web_wasm_objdump_gate.py \
            tests/integration/test_web_wasm_static_chain_gate.py \
            tests/integration/test_web_wasm_multi_module_gate.py \
            tests/integration/test_web_script_source_gate.py \
            tests/integration/test_m11_r2_live_gate.py \
            tests/integration/test_m11_r2_static_gate.py \
            tests/integration/test_m11_r2_exports_gate.py \
            tests/integration/test_m11_r2_xrefs_gate.py \
            tests/integration/test_m11_r2_stripped_xrefs_from_gate.py \
            tests/integration/test_m11_r2_macho_fat_slice_select_gate.py \
            tests/integration/test_m11_elf_session_r2_e2e_gate.py \
            tests/integration/test_m11_elf_session_arm_arch_label_gate.py \
            tests/integration/test_m11_r2_arch_gate.py \
            tests/integration/test_m11_r2_arm32_gate.py \
            tests/integration/test_m11_optional_backends_gate.py \
            tests/integration/test_m11_frida_live_gate.py \
            tests/integration/test_m11_frida_symbols_gate.py \
            tests/integration/test_m11_frida_r2_crosscheck_gate.py \
            tests/integration/test_m11_frida_ghidra_crosscheck_gate.py \
            tests/integration/test_m11_ghidra_live_gate.py \
            tests/integration/test_m11_ghidra_arch_gate.py \
            tests/integration/test_m11_ghidra_arm32_gate.py \
            tests/integration/test_m11_ghidra_arm_xrefs_gate.py \
            tests/integration/test_m11_ghidra_data_xrefs_gate.py \
            tests/integration/test_m11_ghidra_arm_data_xrefs_gate.py \
            tests/integration/test_m11_ghidra_decompile_gate.py \
            tests/integration/test_m11_ghidra_stripped_recovery_gate.py \
            tests/integration/test_m11_elf_session_ghidra_e2e_gate.py \
            tests/integration/test_m11_r2_ghidra_stripped_agree_gate.py \
            tests/integration/test_m11_ghidra_arm_decompile_gate.py \
            tests/integration/test_m11_ghidra_pe_decompile_gate.py \
            tests/integration/test_m11_ghidra_macho_decompile_gate.py \
            tests/integration/test_m11_r2_ghidra_agree_gate.py \
            tests/integration/test_m11_r2_ghidra_elf_coords_agree_gate.py \
            tests/integration/test_m11_r2_ghidra_macho_coords_agree_gate.py \
            tests/integration/test_m11_r2_ghidra_macho_fat_agree_gate.py \
            tests/integration/test_m11_r2_ghidra_data_xref_agree_gate.py \
            tests/integration/test_m11_r2_ghidra_arm_agree_gate.py \
            tests/integration/test_m11_r2_ghidra_arm_data_xref_agree_gate.py \
            tests/integration/test_m11_r2_ghidra_pe_agree_gate.py \
            tests/integration/test_m11_r2_ghidra_pe_data_xref_agree_gate.py \
            tests/integration/test_m11_r2_arm_xrefs_gate.py \
            tests/integration/test_m11_r2_data_xrefs_gate.py \
            tests/integration/test_m11_r2_pe_imports_gate.py \
            tests/integration/test_android_re_gate.py \
            tests/integration/test_android_tools_gate.py \
            tests/integration/test_android_dex_gate.py \
            tests/integration/test_android_manifest_gate.py \
            tests/integration/test_android_jadx_apk_gate.py \
            tests/integration/test_android_sign_gate.py \
            tests/integration/test_android_cert_gate.py \
            tests/integration/test_android_apktool_resources_gate.py \
            tests/integration/test_agent_browser_smoke.py \
            -q -rs --tb=short --timeout=300

  linux-i386-gates:
    # 32-bit x86 (i386) needs gcc-multilib for `gcc -m32`, and gcc-multilib
    # HARD-conflicts with the aarch64/arm cross toolchains apt cannot co-install
    # them, so the i386 static gates run in their own job with just radare2 +
    # Ghidra rather than dropping ARM coverage from linux-nonpe-gates.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GHIDRA_VERSION: "11.2.1"
      GHIDRA_DIST: "ghidra_11.2.1_PUBLIC_20241105"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install radare2 and the 32-bit x86 toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends radare2 gcc-multilib libc6-dev-i386

      - name: Install package (portable backends only)
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[test,dev]"

      - name: Cache Ghidra
        id: cache-ghidra
        uses: actions/cache@v4
        with:
          path: ~/ghidra
          key: ghidra-${{ env.GHIDRA_VERSION }}

      - name: Install Ghidra
        if: steps.cache-ghidra.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/ghidra
          curl -fsSL -o /tmp/ghidra.zip \
            "https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_${GHIDRA_VERSION}_build/${GHIDRA_DIST}.zip"
          unzip -q /tmp/ghidra.zip -d ~/ghidra

      - name: Point at Ghidra
        run: echo "HEADLESS_RE_GHIDRA_HOME=$HOME/ghidra/ghidra_${GHIDRA_VERSION}_PUBLIC" >> "$GITHUB_ENV"

      - name: Backends are discoverable (skip != pass)
        run: |
          set -e
          for tool in r2 gcc; do
            command -v "$tool" >/dev/null || { echo "::error::$tool not on PATH"; exit 1; }
          done
          echo 'int main(){return 0;}' | gcc -m32 -x c - -o /tmp/t32 \
            || { echo "::error::gcc -m32 cannot build (missing multilib)"; exit 1; }
          test -x "$HEADLESS_RE_GHIDRA_HOME/support/analyzeHeadless" \
            || { echo "::error::ghidra analyzeHeadless missing at $HEADLESS_RE_GHIDRA_HOME"; exit 1; }

      - name: i386 static gates
        run: |
          python -m pytest \
            tests/integration/test_m11_r2_ghidra_i386_agree_gate.py \
            tests/integration/test_m11_ghidra_i386_decompile_gate.py \
            tests/integration/test_m11_r2_ghidra_i386_data_xref_agree_gate.py \
            -q -rs --tb=short --timeout=300

  webui:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: webui/package-lock.json

      - name: Install
        working-directory: webui
        run: npm ci

      - name: Dependency audit
        working-directory: webui
        run: npm audit --audit-level=high

      - name: Typecheck
        working-directory: webui
        run: npm run typecheck

      - name: Unit tests
        working-directory: webui
        run: npx vitest run

      - name: Build
        working-directory: webui
        run: npm run build

      - name: Committed SPA is not stale
        run: |
          # Vite encodes content in the asset filename, so an added or removed
          # asset means the committed bundle no longer matches webui/src. Pure
          # modifications are ignored because the runner rewrites line endings.
          $changes = @(git status --porcelain -- src/headless_re_mcp/web/spa)
          $structural = @($changes | Where-Object { $_ -notmatch '^.M' -and $_ -notmatch '^M.' })
          if ($structural.Count -gt 0) {
            $changes | ForEach-Object { Write-Host $_ }
            throw "committed SPA is stale - run 'npm run build' in webui and commit src/headless_re_mcp/web/spa"
          }
          Write-Host "committed SPA matches webui/src"
