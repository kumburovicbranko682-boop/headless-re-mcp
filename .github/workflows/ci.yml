# Every-commit quality gate (M16.1) — no proprietary backends required.
name: ci

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: windows-latest
    # A hung backend probe used to burn the full six-hour default before anyone
    # noticed the job was not going to finish. The ceiling is generous because
    # the unit suite keeps growing and Windows is the slowest runner; the step
    # timeout below fails first so a genuine hang still names itself.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # requires-python promises 3.11, so 3.11 has to be exercised or the
        # promise is untested.
        python-version: ["3.11", "3.12"]
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[test,dev,web]"

      - name: Ruff
        run: python -m ruff check src tests fixtures openai_bridge.py

      - name: Mypy strict
        run: python -m mypy

      - name: Compileall
        run: python -m compileall -q src

      - name: Pip check
        run: python -m pip check

      - name: Python dependency audit
        run: python -m pip_audit --skip-editable --progress-spinner=off

      - name: Unit tests
        # -rs prints every skip reason: a suite that quietly skips half of
        # itself reads exactly like a suite that passed.
        # A single stuck process-backed test must name itself and fail before
        # the 30-minute job deadline erases the useful per-test context.
        # The step timeout exists because the job timeout has been observed to
        # cancel the whole job with its logs unrecoverable; failing the step
        # instead keeps the transcript and still uploads coverage. It sits below
        # the job ceiling so a stuck test fails here (with context) rather than
        # tripping the job deadline; raised as the growing suite pushed Windows
        # 3.11 past the old 25-minute wall.
        timeout-minutes: 38
        run: python -m pytest tests/unit -q -rs --tb=short --timeout=120 --cov --cov-report=term --cov-report=xml

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: warn

      - name: License and lock consistency
        run: |
          if (-not (Test-Path LICENSE)) { throw "LICENSE missing" }
          $lic = Get-Content LICENSE -Raw
          if ($lic -notmatch "GNU GENERAL PUBLIC LICENSE") { throw "LICENSE is not full GPL-3.0 text" }
          if (-not (Test-Path upstream.lock.json)) { throw "upstream.lock.json missing" }
          Get-Content upstream.lock.json | ConvertFrom-Json | Out-Null
          Write-Host "license+lock ok"

      - name: Config generate smoke
        run: |
          python -m headless_re_mcp config generate --skip-doctor --no-examples | Out-File artifacts_ci_config.json -Encoding utf8
          $j = Get-Content artifacts_ci_config.json -Raw | ConvertFrom-Json
          if (-not $j.ok) { throw "config generate failed" }

      - name: OpenAI tool export smoke
        run: |
          python openai_bridge.py --names-only | Out-File artifacts_ci_openai.json -Encoding utf8
          $j = Get-Content artifacts_ci_openai.json -Raw | ConvertFrom-Json
          if ($j.count -lt 1) { throw "openai bridge exported no tools" }
          Write-Host "openai tools: $($j.count)"

  linux-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[test,dev,web]"

      - name: Ruff
        run: python -m ruff check src tests fixtures openai_bridge.py

      - name: Mypy strict
        run: python -m mypy

      - name: Compileall and dependency check
        run: |
          python -m compileall -q src
          python -m pip check

      - name: Linux unit tests
        # Same per-test and step bounds as the Windows job: a hung test names
        # itself, and a wedged step fails with its logs instead of the job
        # timeout cancelling the whole job and losing them.
        timeout-minutes: 20
        run: python -m pytest tests/unit -q -rs --tb=short --timeout=120 --cov --cov-report=term

      - name: Doctor and core service smoke
        run: |
          python -m headless_re_mcp doctor --json --strict
          python -c "from headless_re_mcp.core.service import AnalysisService; service = AnalysisService(); assert service.readiness().ok; service.close_all()"
          python -m headless_re_mcp config generate --skip-doctor --no-examples --output artifacts_ci_config.json
          python openai_bridge.py --names-only > artifacts_ci_openai.json

      - name: Build Linux wheel and sdist
        run: |
          python -m pip install build
          python -m build

      - name: License and lock consistency
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          assert "GNU GENERAL PUBLIC LICENSE" in Path("LICENSE").read_text(encoding="utf-8")
          json.loads(Path("upstream.lock.json").read_text(encoding="utf-8"))
          PY

  linux-nonpe-gates:
    # Real-backend integration gates for the non-PE lines: web/CDP (Playwright),
    # HTTP interception (mitmproxy), Android static analysis (androguard),
    # cross-platform static analysis (radare2), and JS/WASM deobfuscation
    # (webcrack, wabt). Every one of these backends is OSS and cross-platform, so
    # unlike the Windows self-hosted integration job they run on a hosted runner
    # on every push -- turning gates that previously could only ever skip
    # ("skip != pass") into real coverage for the lines this project cares about
    # beyond PE reversing. IDA (proprietary, PE-only) and the x64dbg/WinDbg/Win32
    # gates stay on windows-integration.yml; the conftest already skips the
    # Windows-only modules here.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v7
        with:
          # webcrack needs Node 22 or 24; pin 22 to match the js.* backend's
          # documented floor.
          node-version: "22"

      - name: Install backend CLIs
        run: |
          sudo apt-get update
          # radare2 -> r2.* static gate; wabt -> wasm2wat/wasm-objdump for the
          # WASM gate; the mingw cross-compiler builds the PE fixture below.
          sudo apt-get install -y radare2 wabt gcc-mingw-w64-x86-64
          # webcrack -> js.deobfuscate / js.unpack_bundle gate. shutil.which finds
          # it on the npm global bin that setup-node puts on PATH.
          npm install -g webcrack

      - name: Install package
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[test,dev,web,android,proxy,browser]"
          # --with-deps pulls the OS libraries headless Chromium needs to launch
          # on a bare runner; without them the web gates fail at browser launch.
          python -m playwright install --with-deps chromium

      - name: Build the x64 PE fixture the r2 gate maps
        run: |
          # radare2 analyses a real PE. The fixture is console_fixture.c built as
          # a windows-subsystem executable, exactly as CMakeLists' headless_fixture
          # target does; mingw cross-compiles it on Linux with no Windows host.
          mkdir -p artifacts/fixtures-x64
          x86_64-w64-mingw32-gcc -O2 -DHEADLESS_RE_FIXTURE_WINDOWS_SUBSYSTEM -mwindows \
            fixtures/native/console_fixture.c -o artifacts/fixtures-x64/headless_fixture.exe

      - name: Non-PE integration gates
        run: |
          # -rs prints every skip reason so a skip never reads as a pass. Three
          # gates are excluded rather than run:
          #   * the two idalib gates need IDA, a proprietary PE-only backend that
          #     cannot run on a hosted OSS runner, and on main they fail instead
          #     of skip once a fixture is present (the honest-skip fix is not yet
          #     merged here);
          #   * the browser smoke gate hardcodes a Windows Chrome path on main and
          #     fails until its portable-launch fix lands -- drop this --ignore
          #     once that merges.
          # Everything else either runs on the OSS backends installed above or
          # skips itself as Windows-only via the integration conftest.
          python -m pytest tests/integration -rs --tb=short \
            --ignore=tests/integration/test_idalib_gate.py \
            --ignore=tests/integration/test_mcp_static_idalib.py \
            --ignore=tests/integration/test_agent_browser_smoke.py

  webui:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: webui/package-lock.json

      - name: Install
        working-directory: webui
        run: npm ci

      - name: Dependency audit
        working-directory: webui
        run: npm audit --audit-level=high

      - name: Typecheck
        working-directory: webui
        run: npm run typecheck

      - name: Unit tests
        working-directory: webui
        run: npx vitest run

      - name: Build
        working-directory: webui
        run: npm run build

      - name: Committed SPA is not stale
        run: |
          # Vite encodes content in the asset filename, so an added or removed
          # asset means the committed bundle no longer matches webui/src. Pure
          # modifications are ignored because the runner rewrites line endings.
          $changes = @(git status --porcelain -- src/headless_re_mcp/web/spa)
          $structural = @($changes | Where-Object { $_ -notmatch '^.M' -and $_ -notmatch '^M.' })
          if ($structural.Count -gt 0) {
            $changes | ForEach-Object { Write-Host $_ }
            throw "committed SPA is stale - run 'npm run build' in webui and commit src/headless_re_mcp/web/spa"
          }
          Write-Host "committed SPA matches webui/src"
