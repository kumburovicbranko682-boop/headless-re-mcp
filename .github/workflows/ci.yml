# Every-commit quality gate (M16.1) — no proprietary backends required.
name: ci

on:
  push:
    branches: [main, master, "cursor/ci-checkpoint-jadxrelease-21706dd6-82ce"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: windows-latest
    # A hung backend probe used to burn the full six-hour default before anyone
    # noticed the job was not going to finish.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # requires-python promises 3.11, so 3.11 has to be exercised or the
        # promise is untested.
        python-version: ["3.11", "3.12"]
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[test,dev,web]"

      - name: Ruff
        run: python -m ruff check src tests fixtures openai_bridge.py

      - name: Mypy strict
        run: python -m mypy

      - name: Compileall
        run: python -m compileall -q src

      - name: Pip check
        run: python -m pip check

      - name: Python dependency audit
        run: python -m pip_audit --skip-editable --progress-spinner=off

      - name: Unit tests
        # -rs prints every skip reason: a suite that quietly skips half of
        # itself reads exactly like a suite that passed.
        # A single stuck process-backed test must name itself and fail before
        # the 30-minute job deadline erases the useful per-test context.
        # The step timeout exists because the job timeout has been observed to
        # cancel the whole job with its logs unrecoverable; failing the step
        # instead keeps the transcript and still uploads coverage.
        timeout-minutes: 25
        run: python -m pytest tests/unit -q -rs --tb=short --timeout=120 --cov --cov-report=term --cov-report=xml

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: warn

      - name: License and lock consistency
        run: |
          if (-not (Test-Path LICENSE)) { throw "LICENSE missing" }
          $lic = Get-Content LICENSE -Raw
          if ($lic -notmatch "GNU GENERAL PUBLIC LICENSE") { throw "LICENSE is not full GPL-3.0 text" }
          if (-not (Test-Path upstream.lock.json)) { throw "upstream.lock.json missing" }
          Get-Content upstream.lock.json | ConvertFrom-Json | Out-Null
          Write-Host "license+lock ok"

      - name: Config generate smoke
        run: |
          python -m headless_re_mcp config generate --skip-doctor --no-examples | Out-File artifacts_ci_config.json -Encoding utf8
          $j = Get-Content artifacts_ci_config.json -Raw | ConvertFrom-Json
          if (-not $j.ok) { throw "config generate failed" }

      - name: OpenAI tool export smoke
        run: |
          python openai_bridge.py --names-only | Out-File artifacts_ci_openai.json -Encoding utf8
          $j = Get-Content artifacts_ci_openai.json -Raw | ConvertFrom-Json
          if ($j.count -lt 1) { throw "openai bridge exported no tools" }
          Write-Host "openai tools: $($j.count)"

  linux-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[test,dev,web]"

      - name: Ruff
        run: python -m ruff check src tests fixtures openai_bridge.py

      - name: Mypy strict
        run: python -m mypy

      - name: Compileall and dependency check
        run: |
          python -m compileall -q src
          python -m pip check

      - name: Linux unit tests
        # Same per-test and step bounds as the Windows job: a hung test names
        # itself, and a wedged step fails with its logs instead of the job
        # timeout cancelling the whole job and losing them.
        timeout-minutes: 20
        run: python -m pytest tests/unit -q -rs --tb=short --timeout=120 --cov --cov-report=term

      - name: Doctor and core service smoke
        run: |
          python -m headless_re_mcp doctor --json --strict
          python -c "from headless_re_mcp.core.service import AnalysisService; service = AnalysisService(); assert service.readiness().ok; service.close_all()"
          python -m headless_re_mcp config generate --skip-doctor --no-examples --output artifacts_ci_config.json
          python openai_bridge.py --names-only > artifacts_ci_openai.json

      - name: Build Linux wheel and sdist
        run: |
          python -m pip install build
          python -m build

      - name: License and lock consistency
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          assert "GNU GENERAL PUBLIC LICENSE" in Path("LICENSE").read_text(encoding="utf-8")
          json.loads(Path("upstream.lock.json").read_text(encoding="utf-8"))
          PY

  linux-integration:
    # The self-hosted Windows runner (windows-integration.yml) is the only place
    # tests/integration ran, so every portable non-PE gate -- Android/androguard,
    # Frida, radare2, Ghidra, UPX unpack, wabt, mitmproxy, the adb device line,
    # the web console -- was only ever exercised on Windows. This job tells the Linux half of that story on a
    # stock GitHub runner using none but FOSS backends, matching this workflow's
    # "no proprietary backends required" promise. Gates run for real where their
    # backend installs and skip honestly (-rs prints why; skip != pass) where it
    # does not; the Windows-only gates self-skip here via the conftest guard.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          # Ghidra 12.x refuses to launch on anything below JDK 21; the other
          # JVM tools here (jadx, apktool, apksigner, keytool) all run on 21.
          java-version: "21"

      - name: Install FOSS analysis backends
        # adb is the host server the device.* gate talks to; it needs no
        # attached device (the gate starts a private server on a free port).
        run: |
          sudo apt-get update
          sudo apt-get install -y radare2 upx-ucl wabt apktool apksigner adb

      - name: Create an Android debug keystore for the apk.sign gate
        # apk.sign defaults to the standard Android debug keystore; keytool ships
        # with the JDK installed above. Generating it lets the sign gate run for
        # real instead of skipping, and matches what the Android build tools do.
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android -keypass android \
            -alias androiddebugkey \
            -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA -keysize 2048 -validity 10000

      - name: Install package with Linux-capable extras
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[test,dev,web,android,browser,proxy]"

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Install webcrack (best effort)
        # The JS gate uses webcrack; if the global install fails the gate skips
        # honestly rather than failing the job over an optional npm package.
        run: npm install -g webcrack || echo "webcrack unavailable; the JS gate will skip"

      - name: Install jadx (best effort)
        # jadx is not packaged for apt, so fetch a pinned release and put it on
        # PATH for the Android decompile gate. Best-effort: if the download
        # fails, jadx stays off PATH and the gate skips (skip != pass) rather
        # than failing the job. setup-java above guarantees a JRE to run it, so
        # a jadx that is present is a jadx that works.
        run: |
          JADX_VERSION=1.5.0
          if curl -fsSL -o /tmp/jadx.zip \
              "https://github.com/skylot/jadx/releases/download/v${JADX_VERSION}/jadx-${JADX_VERSION}.zip" \
              && unzip -oq /tmp/jadx.zip -d "$HOME/jadx"; then
            echo "$HOME/jadx/bin" >> "$GITHUB_PATH"
          else
            echo "jadx unavailable; the decompile gate will skip"
          fi

      - name: Install Ghidra (best effort)
        # The Ghidra live gate skips unless HEADLESS_RE_GHIDRA_HOME names a
        # runnable install, and nothing here provided one, so that gate was the
        # only entry in the list below that never actually ran in CI. Fetch a
        # pinned release and install PyGhidra from the wheels the distro itself
        # vendors (Ghidra >= 11.3 dropped Jython, so the adapter drives a .py
        # postScript through PyGhidra; --no-index pins us to the exact version
        # this Ghidra shipped with). Best-effort like jadx above: if any part
        # fails, HEADLESS_RE_GHIDRA_HOME stays unset and the gate skips
        # (skip != pass) rather than failing the job over an optional backend.
        run: |
          GHIDRA_VERSION=12.1.3
          GHIDRA_DATE=20260817
          GHIDRA_HOME="$HOME/ghidra/ghidra_${GHIDRA_VERSION}_PUBLIC"
          if curl -fsSL -o /tmp/ghidra.zip \
              "https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_${GHIDRA_VERSION}_build/ghidra_${GHIDRA_VERSION}_PUBLIC_${GHIDRA_DATE}.zip" \
              && unzip -oq /tmp/ghidra.zip -d "$HOME/ghidra" \
              && python -m pip install --no-index \
                -f "$GHIDRA_HOME/Ghidra/Features/PyGhidra/pypkg/dist" pyghidra; then
            echo "HEADLESS_RE_GHIDRA_HOME=$GHIDRA_HOME" >> "$GITHUB_ENV"
          else
            echo "ghidra unavailable; the Ghidra gate will skip"
          fi

      - name: Non-PE integration gates
        # Explicit portable set rather than the whole directory: these are the
        # gates validated to run or skip cleanly on Linux, so the job stays
        # predictable instead of collecting a Windows-only gate that errors here.
        # --timeout bounds any single stuck gate; faulthandler_timeout is the
        # C-level backstop.
        timeout-minutes: 20
        run: >-
          python -m pytest -m integration -rs --tb=short --timeout=300 --no-cov
          tests/integration/test_android_re_gate.py
          tests/integration/test_adb_device_gate.py
          tests/integration/test_m11_frida_live_gate.py
          tests/integration/test_m11_r2_live_gate.py
          tests/integration/test_m11_ghidra_live_gate.py
          tests/integration/test_m11_optional_backends_gate.py
          tests/integration/test_m5_unpack_live_gate.py
          tests/integration/test_proxy_lifecycle_gate.py
          tests/integration/test_web_lifecycle_gate.py
          tests/integration/test_web_re_gate.py
          tests/integration/test_web_capture_gate.py
          tests/integration/test_agent_browser_smoke.py

  webui:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: webui/package-lock.json

      - name: Install
        working-directory: webui
        run: npm ci

      - name: Dependency audit
        working-directory: webui
        run: npm audit --audit-level=high

      - name: Typecheck
        working-directory: webui
        run: npm run typecheck

      - name: Unit tests
        working-directory: webui
        run: npx vitest run

      - name: Build
        working-directory: webui
        run: npm run build

      - name: Committed SPA is not stale
        run: |
          # Vite encodes content in the asset filename, so an added or removed
          # asset means the committed bundle no longer matches webui/src. Pure
          # modifications are ignored because the runner rewrites line endings.
          $changes = @(git status --porcelain -- src/headless_re_mcp/web/spa)
          $structural = @($changes | Where-Object { $_ -notmatch '^.M' -and $_ -notmatch '^M.' })
          if ($structural.Count -gt 0) {
            $changes | ForEach-Object { Write-Host $_ }
            throw "committed SPA is stale - run 'npm run build' in webui and commit src/headless_re_mcp/web/spa"
          }
          Write-Host "committed SPA matches webui/src"
