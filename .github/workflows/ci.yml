# Every-commit quality gate (M16.1) — no proprietary backends required.
name: ci

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: windows-latest
    # A hung backend probe used to burn the full six-hour default before anyone
    # noticed the job was not going to finish.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # requires-python promises 3.11, so 3.11 has to be exercised or the
        # promise is untested.
        python-version: ["3.11", "3.12"]
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[test,dev,web]"

      - name: Ruff
        run: python -m ruff check src tests fixtures openai_bridge.py

      - name: Mypy strict
        run: python -m mypy

      - name: Compileall
        run: python -m compileall -q src

      - name: Pip check
        run: python -m pip check

      - name: Python dependency audit
        run: python -m pip_audit --skip-editable --progress-spinner=off

      - name: Unit tests
        # -rs prints every skip reason: a suite that quietly skips half of
        # itself reads exactly like a suite that passed.
        # A single stuck process-backed test must name itself and fail before
        # the 30-minute job deadline erases the useful per-test context.
        # The step timeout exists because the job timeout has been observed to
        # cancel the whole job with its logs unrecoverable; failing the step
        # instead keeps the transcript and still uploads coverage.
        timeout-minutes: 25
        run: python -m pytest tests/unit -q -rs --tb=short --timeout=120 --cov --cov-report=term --cov-report=xml

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: warn

      - name: License and lock consistency
        run: |
          if (-not (Test-Path LICENSE)) { throw "LICENSE missing" }
          $lic = Get-Content LICENSE -Raw
          if ($lic -notmatch "GNU GENERAL PUBLIC LICENSE") { throw "LICENSE is not full GPL-3.0 text" }
          if (-not (Test-Path upstream.lock.json)) { throw "upstream.lock.json missing" }
          Get-Content upstream.lock.json | ConvertFrom-Json | Out-Null
          Write-Host "license+lock ok"

      - name: Config generate smoke
        run: |
          python -m headless_re_mcp config generate --skip-doctor --no-examples | Out-File artifacts_ci_config.json -Encoding utf8
          $j = Get-Content artifacts_ci_config.json -Raw | ConvertFrom-Json
          if (-not $j.ok) { throw "config generate failed" }

      - name: OpenAI tool export smoke
        run: |
          python openai_bridge.py --names-only | Out-File artifacts_ci_openai.json -Encoding utf8
          $j = Get-Content artifacts_ci_openai.json -Raw | ConvertFrom-Json
          if ($j.count -lt 1) { throw "openai bridge exported no tools" }
          Write-Host "openai tools: $($j.count)"

  linux-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[test,dev,web]"

      - name: Ruff
        run: python -m ruff check src tests fixtures openai_bridge.py

      - name: Mypy strict
        run: python -m mypy

      - name: Compileall and dependency check
        run: |
          python -m compileall -q src
          python -m pip check

      - name: Linux unit tests
        # Same per-test and step bounds as the Windows job: a hung test names
        # itself, and a wedged step fails with its logs instead of the job
        # timeout cancelling the whole job and losing them.
        timeout-minutes: 20
        run: python -m pytest tests/unit -q -rs --tb=short --timeout=120 --cov --cov-report=term

      - name: Doctor and core service smoke
        run: |
          python -m headless_re_mcp doctor --json --strict
          python -c "from headless_re_mcp.core.service import AnalysisService; service = AnalysisService(); assert service.readiness().ok; service.close_all()"
          python -m headless_re_mcp config generate --skip-doctor --no-examples --output artifacts_ci_config.json
          python openai_bridge.py --names-only > artifacts_ci_openai.json

      - name: Build Linux wheel and sdist
        run: |
          python -m pip install build
          python -m build

      - name: License and lock consistency
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          assert "GNU GENERAL PUBLIC LICENSE" in Path("LICENSE").read_text(encoding="utf-8")
          json.loads(Path("upstream.lock.json").read_text(encoding="utf-8"))
          PY

  # Real-backend coverage for the Ghidra line. Ghidra is a cross-platform JVM
  # tool, so its headless analysis runs for real on Linux instead of only being
  # asserted-when-missing -- "skip != pass" only means something when the
  # backend is actually present somewhere. This is the first CI that ever runs
  # analyzeHeadless; two bugs (the launcher picked the Windows .bat on POSIX and
  # the export script read an undefined ARGS) hid here precisely because nothing
  # exercised it.
  linux-ghidra-live:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Both supported script runtimes: 11.3.2 is the last line that bundles
        # Jython, 12.x removed it from the default install. The Java export
        # postScript must keep working on both, or the backend silently loses
        # one side (exactly how the Jython script broke on Ghidra 12).
        include:
          - ghidra-version: "11.3.2"
            ghidra-date: "20250415"
          - ghidra-version: "12.1.3"
            ghidra-date: "20260817"
    env:
      GHIDRA_VERSION: ${{ matrix.ghidra-version }}
      GHIDRA_DATE: ${{ matrix.ghidra-date }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          # Ghidra 11.3+ (both matrix versions) requires JDK 21+.
          java-version: "21"

      - name: Cache Ghidra release
        id: ghidra-cache
        uses: actions/cache@v4
        with:
          path: ~/ghidra
          key: ghidra-${{ env.GHIDRA_VERSION }}-${{ env.GHIDRA_DATE }}

      - name: Install Ghidra
        if: steps.ghidra-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/ghidra
          url="https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_${GHIDRA_VERSION}_build/ghidra_${GHIDRA_VERSION}_PUBLIC_${GHIDRA_DATE}.zip"
          curl -fsSL -o /tmp/ghidra.zip "$url"
          unzip -q /tmp/ghidra.zip -d ~/ghidra

      - name: Install package
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[test,dev]"

      - name: Ghidra headless gate runs for real (skip != pass)
        run: |
          export HEADLESS_RE_GHIDRA_HOME="$(echo ~/ghidra/ghidra_${GHIDRA_VERSION}_PUBLIC)"
          test -x "$HEADLESS_RE_GHIDRA_HOME/support/analyzeHeadless" || { echo "analyzeHeadless missing at $HEADLESS_RE_GHIDRA_HOME"; exit 1; }
          python -m headless_re_mcp doctor --json | python -c "import json,sys; d=json.load(sys.stdin); g=[p for p in d.get('probes',[]) if p.get('name')=='ghidra']; print('ghidra probe:', g); sys.exit(0 if g and g[0].get('status')=='ready' else 'ghidra probe not ready with Ghidra installed')"
          python -m pytest tests/integration/test_ghidra_live_gate.py \
            -rs --tb=short --junitxml=ghidra-gate.xml
          python - <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          tree = ET.parse("ghidra-gate.xml")
          cases = list(tree.iter("testcase"))
          skipped = [c.get("name") for c in cases if c.find("skipped") is not None]
          # Ghidra was just installed, so a skip here means the gate could not
          # reach it -- exactly the false-green "skip != pass" warns about.
          if not cases:
              sys.exit("no ghidra gate was collected")
          if skipped:
              sys.exit(f"ghidra gate skipped despite an installed Ghidra: {skipped}")
          print(f"ghidra gate ran for real: {[c.get('name') for c in cases]}")
          PY

  webui:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: webui/package-lock.json

      - name: Install
        working-directory: webui
        run: npm ci

      - name: Dependency audit
        working-directory: webui
        run: npm audit --audit-level=high

      - name: Typecheck
        working-directory: webui
        run: npm run typecheck

      - name: Unit tests
        working-directory: webui
        run: npx vitest run

      - name: Build
        working-directory: webui
        run: npm run build

      - name: Committed SPA is not stale
        run: |
          # Vite encodes content in the asset filename, so an added or removed
          # asset means the committed bundle no longer matches webui/src. Pure
          # modifications are ignored because the runner rewrites line endings.
          $changes = @(git status --porcelain -- src/headless_re_mcp/web/spa)
          $structural = @($changes | Where-Object { $_ -notmatch '^.M' -and $_ -notmatch '^M.' })
          if ($structural.Count -gt 0) {
            $changes | ForEach-Object { Write-Host $_ }
            throw "committed SPA is stale - run 'npm run build' in webui and commit src/headless_re_mcp/web/spa"
          }
          Write-Host "committed SPA matches webui/src"
