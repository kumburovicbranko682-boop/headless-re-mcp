# Linux real-backend gates for the portable (non-PE) lines.
#
# Everything these gates need is open source and installs on a stock
# GitHub-hosted runner, so -- unlike windows-integration.yml, which waits on a
# self-hosted box with IDA and x64dbg -- this runs on every push and pull
# request. It exercises the chains whose maturity has lagged the PE work:
#   * Web       -- CDP driving via Playwright's bundled Chromium, webcrack, wabt
#   * Intercept -- mitmproxy lifecycle plus a real HTTP flow captured,
#                  retrieved, exported to HAR, and replayed through the proxy
#   * Android   -- androguard APK metadata, a real hand-assembled DEX parsed
#                  end to end (classes/methods/strings/xrefs), jadx decompiling
#                  that DEX to Java, and safe degradation with no device
#   * Static    -- radare2 against a locally built ELF (the non-PE mapping path)
# tests/integration/conftest.py skips the Windows-only gates by name, and -rs
# prints every remaining skip reason, so a skip here never reads as a pass.
name: linux-integration

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-latest
    # The backend installs dominate; the gates themselves finish in seconds. A
    # hung browser or proxy probe must name itself and fail well inside this.
    timeout-minutes: 30
    env:
      # Pin the jadx release so the cache key and download URL agree; bump
      # deliberately. The extracted launcher lives at ~/jadx/bin/jadx.
      JADX_VERSION: "1.5.6"
    strategy:
      fail-fast: false
      matrix:
        # requires-python promises 3.11, so the real backends are exercised on
        # the floor as well as the current interpreter, not just one of them.
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # jadx 1.5.x runs on JDK 11+; temurin 21 matches the Ghidra job.
          java-version: "21"

      - name: System backends
        run: |
          # radare2: cross-platform static analysis. wabt: wasm2wat / wasm-objdump.
          # gcc: builds the portable ELF fixture so the radare2 non-PE gate runs
          # instead of skipping for want of a compiler.
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends radare2 wabt gcc

      - name: Cache jadx
        id: jadx-cache
        uses: actions/cache@v4
        with:
          path: ~/jadx
          key: jadx-${{ env.JADX_VERSION }}

      - name: Install jadx (Android decompiler)
        # A ~25 MB release zip with a launcher script -- the same one the adapter
        # invokes -- so the APK decompile gate runs instead of skipping.
        if: steps.jadx-cache.outputs.cache-hit != 'true'
        run: |
          url="https://github.com/skylot/jadx/releases/download/v${JADX_VERSION}/jadx-${JADX_VERSION}.zip"
          curl -fsSL -o /tmp/jadx.zip "$url"
          mkdir -p "$HOME/jadx"
          unzip -q /tmp/jadx.zip -d "$HOME/jadx"
          rm -f /tmp/jadx.zip
          chmod +x "$HOME/jadx/bin/jadx"

      - name: JS deobfuscation backend (webcrack)
        run: |
          npm install -g webcrack
          webcrack --version

      - name: Install package with the portable-backend extras
        run: |
          python -m pip install -U pip
          # With proxy present the resolver settles on pydantic 2.11 + typing
          # extensions 4.14, the newest set that also satisfies mitmproxy 12.x
          # (which pins typing-extensions<=4.14). It is consistent, so pip check
          # below is clean; the quality job installs the pydantic 2.13 line.
          python -m pip install -e ".[test,dev,web,android,browser,proxy]"

      - name: Playwright Chromium
        # Bundled Chromium with its system libraries -- the same browser
        # WebBackend launches, so the CDP gates match production.
        run: python -m playwright install --with-deps chromium

      - name: Dependency check
        run: python -m pip check

      - name: Portable non-PE integration gates
        env:
          PYTHONPATH: src
          # Settings.load() reads this; the APK decompile gate resolves the
          # launcher here instead of skipping for want of jadx.
          HEADLESS_RE_JADX: /home/runner/jadx/bin/jadx
        run: |
          # The whole directory, never a hardcoded subset: conftest skips the
          # Windows-only and unconfigured (IDA / de4dot) gates, and running
          # everything means a new portable gate is covered the day it lands.
          # A stuck backend probe must fail before the job deadline erases its
          # context, so each test is bounded independently.
          python -m pytest tests/integration -rs --tb=short --timeout=300

      - name: No browser process leaked
        if: always()
        run: |
          # Playwright's bundled Chromium runs out of the ms-playwright cache, so
          # any such process still alive after the gates is one a session failed
          # to close -- the leak the lifecycle gates guard against, checked once
          # more at the job level. mitmproxy runs in-process (a thread), so it
          # leaves no process to leak; its port release is asserted in-gate.
          leaked=$(pgrep -af 'ms-playwright' || true)
          if [ -n "$leaked" ]; then
            echo "leaked browser processes:"
            echo "$leaked"
            exit 1
          fi
          echo "no browser processes leaked"

  # Ghidra is a ~570 MB JVM download, so it gets its own job: it runs in
  # parallel with the fast gates instead of serialising behind them, needs a
  # JDK the other job does not, and its download is cached across runs. Only the
  # Ghidra gate file is collected, so no Web/Android/proxy backends are needed.
  ghidra-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Pin the release validated locally for reproducibility; bump
      # deliberately. Both the download URL and the extracted directory derive
      # from this (tag Ghidra_<version>_build, asset with its build date).
      GHIDRA_VERSION: "12.1.3"
      GHIDRA_DIRNAME: "ghidra_12.1.3_PUBLIC"
      GHIDRA_ASSET: "ghidra_12.1.3_PUBLIC_20260817.zip"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # Ghidra 11.x+ needs JDK 21; the Java export script compiles under it.
          java-version: "21"

      - name: C toolchain for the ELF fixture
        # conftest compiles fixtures/native/elf_fixture.c; without a compiler the
        # gate would skip for want of a target rather than exercise Ghidra.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc

      - name: Cache Ghidra
        id: ghidra-cache
        uses: actions/cache@v4
        with:
          path: ~/ghidra
          key: ghidra-${{ env.GHIDRA_VERSION }}

      - name: Install Ghidra
        if: steps.ghidra-cache.outputs.cache-hit != 'true'
        run: |
          url="https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_${GHIDRA_VERSION}_build/${GHIDRA_ASSET}"
          curl -fsSL -o /tmp/ghidra.zip "$url"
          mkdir -p "$HOME/ghidra"
          unzip -q /tmp/ghidra.zip -d "$HOME/ghidra"
          rm -f /tmp/ghidra.zip

      - name: Install package
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[test]"

      - name: Ghidra live gate
        env:
          PYTHONPATH: src
          # Settings.load() reads this; the client resolves the POSIX launcher.
          HEADLESS_RE_GHIDRA_HOME: /home/runner/ghidra/${{ env.GHIDRA_DIRNAME }}
        run: |
          # analyzeHeadless spins up a JVM per export, so give each test plenty
          # of headroom; a real hang still self-reports before the job deadline.
          python -m pytest tests/integration/test_ghidra_live_gate.py -rs --tb=short --timeout=900
