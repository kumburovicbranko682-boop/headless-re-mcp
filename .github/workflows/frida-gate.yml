# Per-PR frida gate — makes frida's deviceless contract real in CI.
#
# The live frida gate (test_m11_frida_live_gate.py) attaches to a real local
# process and skips without one, so frida's security-critical contract -- it
# refuses a pid outside the session's authorized set, and validates arguments,
# before it ever attaches -- was never exercised on a machine without a target.
# ci.yml runs unit tests only and the sole integration workflow is a manual,
# self-hosted PE job, so a regression that let an unauthorized pid through, or
# turned a validation into a crash, would ship unseen. This job installs the
# frida module and runs the deviceless gate (authorization + argument checks +
# local-device enumeration), none of which need ptrace or a debuggee, so it
# runs on a stock runner and fails here, on the PR.
#
# Light and path-scoped: frida is a pure pip wheel (no Android SDK, Node, wabt,
# Java, or browser). Runs only when the frida backend, its service/tools, or
# the gate changes.
name: frida-gate

on:
  pull_request:
    paths:
      - "src/headless_re_mcp/backends/frida/**"
      - "src/headless_re_mcp/core/service_frida.py"
      - "src/headless_re_mcp/tools/frida.py"
      - "tests/integration/test_frida_deviceless_gate.py"
      - ".github/workflows/frida-gate.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frida-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install package + frida (pure pip wheel; no SDK/device needed)
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[test,dev]" frida

      - name: Tool sanity — frida must import and enumerate, not skip the gate
        # If frida is missing the gate skips and the job reads green on zero
        # coverage. Fail loudly here instead so a broken install cannot pass.
        run: |
          python -c "import frida; print('frida', frida.__version__)"
          python -c "from headless_re_mcp.backends.frida.client import FridaClient; c=FridaClient(); assert c.available, 'frida not available'; ids={d['id'] for d in c.enumerate_devices()['devices']}; assert 'local' in ids, ids; print('frida local device present')"

      - name: frida deviceless gate
        # -rs prints skip reasons so a skip never reads as a pass.
        run: |
          python -m pytest -rs --tb=short --timeout=120 \
            tests/integration/test_frida_deviceless_gate.py
