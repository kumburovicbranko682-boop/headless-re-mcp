# Per-PR Android static gate — makes the androguard apk.* gate real in CI.
#
# test_android_re_gate.py builds a synthetic APK and asserts the androguard
# apk.* surface degrades cleanly on hostile input: a structured backend_error or
# a best-effort read, never a raised exception and never an internal_error
# carrying an error-boundary incident. But nothing ran it: ci.yml runs unit
# tests only, and the sole integration workflow (windows-integration.yml) is a
# manual, self-hosted PE job that installs .[test,dev,web] -- not androguard --
# so the apk.* cases there only ever degrade to capability_unavailable
# (skip != pass). This job installs the android extra and runs the gate on Linux
# so a regression -- a getter that starts raising or minting an internal_error
# incident on corrupt input -- fails here, on the PR, instead of shipping.
#
# Light and path-scoped: androguard is a pure pip install (no Node, wabt, Java,
# or browser), and the job runs only when the apk backend, its service, target
# classification, or the gate itself changes.
name: android-gate

on:
  pull_request:
    paths:
      - "src/headless_re_mcp/backends/apk/**"
      - "src/headless_re_mcp/core/service_apk.py"
      - "src/headless_re_mcp/core/session.py"
      - "tests/integration/test_android_re_gate.py"
      - ".github/workflows/android-gate.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  android-gate:
    # Pinned, not ubuntu-latest: the androguard the gate was validated against
    # should not shift when the image alias rolls.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install package (android extra; no browser/node/java needed)
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[test,dev,android]"

      - name: Tool sanity — androguard must import, not skip the gate
        # If androguard is missing the apk.* cases degrade to capability_unavailable
        # and the gate reads green on zero real coverage. Fail loudly here instead.
        run: |
          python -c "import androguard; print('androguard', androguard.__version__)"
          python -c "from headless_re_mcp.backends.apk import ApkClient; assert ApkClient().available, 'androguard not available to the apk backend'; print('apk backend available')"

      - name: Android static gate
        # -rs prints skip reasons so a skip never reads as a pass.
        run: |
          python -m pytest -rs --tb=short --timeout=120 \
            tests/integration/test_android_re_gate.py
