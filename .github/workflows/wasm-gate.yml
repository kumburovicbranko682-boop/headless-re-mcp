# WASM line: prove wabt (wasm2wat/wasm-objdump) actually decodes a real module,
# not just that the empty-module magic bytes round-trip. Path-scoped so a PR
# only pays for this gate when it touches the WASM backend or the gate itself.
name: wasm-gate

on:
  pull_request:
    paths:
      - "src/headless_re_mcp/backends/jsre/**"
      - "src/headless_re_mcp/core/service_jsre.py"
      - "src/headless_re_mcp/tools/js_wasm.py"
      - "tests/integration/test_wasm_wabt_live_gate.py"
      - ".github/workflows/wasm-gate.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  wasm-live-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install wabt
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y wabt

      - name: Install package
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[test,dev]"

      - name: Sanity — wabt present and WasmClient resolves it
        # If any of the three binaries is missing the gate would silently skip
        # every test; fail loudly here instead so a broken runner cannot pass.
        run: |
          for tool in wat2wasm wasm2wat wasm-objdump; do
            command -v "$tool" >/dev/null || { echo "missing $tool"; exit 1; }
            "$tool" --version
          done
          python - <<'PY'
          from headless_re_mcp.backends.jsre import WasmClient
          assert WasmClient().available, "WasmClient reports wasm2wat missing after apt install"
          print("WasmClient available")
          PY

      - name: WASM live gate
        # -rs prints skip reasons: a suite that quietly skips itself reads
        # exactly like one that passed.
        run: |
          python -m pytest tests/integration/test_wasm_wabt_live_gate.py \
            -q -rs --tb=short --timeout=120
