# Build, verify and publish the per-user MSI.
#
# workflow_dispatch builds and verifies without publishing, so the packaging
# path can be exercised without cutting a release. Pushing a v* tag additionally
# uploads the installer and its checksum to a GitHub Release.
name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  msi:
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7

      - name: Tag matches package version
        # build_msi.ps1 already refuses a pyproject/Product.wxs mismatch, but
        # nothing ties either to the tag being released: a v* tag on the wrong
        # commit -- or pushed before the version-bump commit -- would publish an
        # MSI that advertises the previous version under the new release name,
        # and its MajorUpgrade would not supersede that prior install. Check
        # before the expensive build; pyproject is the anchor because the
        # build script enforces Product.wxs equality against it.
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          $tagVersion = $env:GITHUB_REF_NAME -replace '^v', ''
          $projectVersion = ([regex]::Match((Get-Content -LiteralPath "pyproject.toml" -Raw), '(?m)^version\s*=\s*"([^"]+)"')).Groups[1].Value
          if (-not $projectVersion) { throw "could not read version from pyproject.toml" }
          if ($tagVersion -ne $projectVersion) {
            throw "tag $env:GITHUB_REF_NAME does not match pyproject.toml version $projectVersion -- tag the release commit, or land the version bump first"
          }
          Write-Host "tag $env:GITHUB_REF_NAME matches pyproject.toml version $projectVersion"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: webui/package-lock.json

      - name: Install package
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[web]"

      - name: Build SPA
        working-directory: webui
        run: |
          npm ci
          npm run build

      - name: Ensure WiX 3.14
        run: |
          $bin = "C:\Program Files (x86)\WiX Toolset v3.14\bin"
          if (-not (Test-Path -LiteralPath $bin)) {
            choco install wixtoolset --no-progress -y
          }
          if (-not (Test-Path -LiteralPath $bin)) { throw "WiX 3.14 toolset unavailable on this runner" }
          "WIXBIN=$bin" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build MSI
        run: .\scripts\build_msi.ps1 -WixDir "$env:WIXBIN"

      - name: Verify MSI round-trip
        run: .\scripts\verify_msi.ps1

      - uses: actions/upload-artifact@v7
        with:
          name: headless-re-mcp-msi
          path: |
            artifacts/release/headless-re-mcp.msi
            artifacts/release/headless-re-mcp.msi.sha256
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$env:GITHUB_REF_NAME" `
            artifacts/release/headless-re-mcp.msi `
            artifacts/release/headless-re-mcp.msi.sha256 `
            --title "$env:GITHUB_REF_NAME" `
            --generate-notes
